<!-- ==========================================================================
     STUDIO AND ANALYTICS ARE ONE PAGE NOW
     ==========================================================================
     They were two pages asking the same question about the same channel. The
     old Studio page held three things:

       - the Google sign-in, which is the only way a channel gets connected.
         That MOVED to analytics.html rather than being dropped — without it
         every "connect" button on the site pointed at a page that could not
         connect anything.
       - a link to "full analytics", which is now the page you land on.
       - "Duel a channel", which compared raw subscriber and view totals, so
         the bigger channel won for being bigger. Fair Fight does that
         comparison properly, with size divided out, and it took over the one
         thing the duel could do that it could not: naming any channel rather
         than picking from a list.

     This file stays as a redirect rather than being deleted, because
     /app.html is in the wild: bookmarks, older links, and the sitemap. A 404
     for somebody's bookmark is a worse outcome than one extra hop.
     ========================================================================== -->
<meta http-equiv='refresh' content='0; url=analytics.html'>
<script>location.replace('analytics.html' + location.hash);</script>
