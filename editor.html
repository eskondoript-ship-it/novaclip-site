<!doctype html>
<html lang="en">
  <head>
<script>/* Theme before first paint, matching every other page. nova.js loads at the
   end of <body>, so without this the editor paints dark once and then switches,
   which on a full-screen dark app is a white flash in the other direction. Kept
   in sync with ncApplyTheme() in nova.js. */
(function(){try{var p=localStorage.getItem('nc_theme')||'system';
var t=(p==='light'||p==='dark')?p:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
var r=document.documentElement;r.setAttribute('data-theme',t);r.setAttribute('data-theme-pref',p);
r.style.colorScheme=t;}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- PWA. The manifest and the icons sit at the site root so they resolve at
     https://novaclip.org/manifest.json and /icons/..., which is what an install
     prompt and PWABuilder look for. The service worker is registered at the end
     of nova.js, which all 24 pages already load. -->
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050505">
    <title>NovaClip — Editor</title>
    <meta name="description" content="NovaClip's video editor: timeline, keyframes, effects, memes, sound effects and a real export." />
    <style>
      /* nova.js floats the points badge and the language/vibe box into fixed
         corners, which is right on a scrolling page and wrong on a full-screen
         app — they landed on the toolbar and across the media library. Park
         them both in the one corner this layout leaves empty. */
      /* nova.js sets dir=rtl on <html> for Persian, Arabic and Urdu, which
         mirrors the whole document. That is right for a page you read and wrong
         for a workspace: it put the media library on the right, ran the
         timeline backwards, and swapped every tool out from under your hand.
         The editor's own chrome stays LTR; the text in it is still translated. */
      #root { direction: ltr; }
      #ncpts { top: auto !important; bottom: 12px !important; right: 12px !important; font-size: .78rem; }
      .themewrap { left: auto !important; right: 12px !important; bottom: 54px !important;
                   width: 168px !important; opacity: .45; transition: opacity .18s; }
      .themewrap:hover { opacity: 1; }
    </style>

  <style>
/* The header's controls ran past the right edge of the viewport — the Export
   button and the last panel tab were clipped off screen at 1920px and could
   not be clicked. The bundle is precompiled, so the fix is a narrow override
   rather than a rebuild: tighten the header's own padding and let the project
   name shrink instead of holding a fixed 12rem. */
header.glass-strong{padding-left:10px!important;padding-right:10px!important}
header.glass-strong>.mx-2{margin-left:4px!important;margin-right:4px!important}
header.glass-strong input[type=text],header.glass-strong input:not([type]){
  width:clamp(84px,11vw,176px)!important;min-width:0!important}
/* The right inspector's tab row (Transform / Color / Effects / Audio /
   Keyframes) is wider than the panel, so the last tab sat past the window edge
   and could not be reached at all. Let the row scroll instead of clipping —
   the tabs stay usable at every width and nothing is hidden. */
div[class*="glass"]>div[class*="border-b"][class*="items-center"]{
  overflow-x:auto!important;scrollbar-width:none}
div[class*="glass"]>div[class*="border-b"][class*="items-center"]::-webkit-scrollbar{display:none}
div[class*="glass"]>div[class*="border-b"][class*="items-center"]>button{flex:0 0 auto}
</style>
<style id="nc-editor-light">
/* ==========================================================================
   LIGHT MODE FOR THE EDITOR
   ==========================================================================
   The theme switch sets data-theme="light" on <html> and every other page
   follows, because their palettes are CSS variables. This one does not: it is a
   compiled Tailwind bundle and its greys are baked in as literal rgb() — you
   can see them in the shipped CSS as .bg-ink-950{background-color:rgb(7 8 12)}.
   No variable exists to redefine, so clicking light did nothing here.

   So the palette is remapped class by class, under the light attribute. The
   scale is inverted by ROLE rather than by value: ink-950 is the deepest
   background in the dark theme, so in light it becomes the lightest, and
   text-ink-100 goes from near-white to near-black. Reversing the numbers
   instead of the roles would have produced white text on white panels.

   These selectors carry html[data-theme="light"], so they outrank the compiled
   single-class rules on specificity and need no !important.
   ========================================================================== */
/* Substring matching, so the alpha variants come too. The bundle uses
   bg-ink-700/60, bg-ink-800/80 and eight more like them, and those are separate
   class names — remapping only the solid ones left dark chips scattered across a
   light page, including the one behind the wordmark, which is how a dark-on-dark
   label survived the first pass. Each shade string is distinct, so there is no
   overlap between them. */
html[data-theme="light"] [class*="bg-ink-950"]{background-color:#FFFFFF}
html[data-theme="light"] [class*="bg-ink-900"]{background-color:#F6F8FC}
html[data-theme="light"] [class*="bg-ink-850"]{background-color:#F0F3F9}
html[data-theme="light"] [class*="bg-ink-800"]{background-color:#E9EEF6}
html[data-theme="light"] [class*="bg-ink-750"]{background-color:#E2E8F3}
html[data-theme="light"] [class*="bg-ink-700"]{background-color:#DAE2EF}
html[data-theme="light"] [class*="bg-ink-600"]{background-color:#C7D1E2}
html[data-theme="light"] [class*="bg-ink-500"]{background-color:#B2BDD1}

/* The two frosted surfaces are hex-with-alpha, not utilities. */
html[data-theme="light"] .glass{background:#F4F7FCcc;border-color:rgba(16,24,44,.09)}

      #ncAR button.on{background:rgba(0,240,255,.18);border-color:rgba(0,240,255,.6);
        color:#00F0FF;box-shadow:0 0 10px rgba(0,240,255,.15)}
      /* Over the preview canvas, which is the project's background colour and
         can be anything — so this reads off its own chip instead of off the
         video. */
      #ncAR .ncar-dims{display:none;font-size:10px;color:rgba(255,255,255,.75);
        text-align:left;letter-spacing:.03em;padding:1px 3px 0}

    <div id="ncAR">
      <button type="button" class="ncar-btn" id="ncARbtn" aria-expanded="false"
              aria-controls="ncARrow" title="Frame size">
        <b id="ncARnow">16:9</b>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="ncar-row" id="ncARrow"></div>
      <div class="ncar-dims" id="ncARdims"></div>
    </div>
    <script>
    /* ======================================================================
       ASPECT RATIO
       ======================================================================
       This panel used to write width/height into localStorage and fire a
       resize event, on the stated belief that "the React app reads project
       dimensions from localStorage". It does not. Nothing in the bundle ever
       reads that key — the autosave only writes it — so every button did
       nothing at all.

       The dimensions live in the store, as settings.width / settings.height,
       and the store has an updateSettings action for exactly this. That is
       what the buttons call now.

       The arithmetic was also inverted: for a ratio of 16/9 it produced
       3413x1920 by multiplying the long side instead of dividing it. The rule
       is that the LONG side keeps the project's current long side, so 16:9 off
       a 1920x1080 project is 1920x1080 and 9:16 is 1080x1920.
       ====================================================================== */
    (function () {
      var RATIOS = [
        ['Free',  0],   ['16:9', 16/9],  ['9:16', 9/16],
        ['1:1',   1],   ['4:3',  4/3],   ['3:4',  3/4],
        ['3:2',  3/2],  ['2:3',  2/3],   ['4:5',  4/5],
        ['21:9', 21/9]
      ];
      var row = document.getElementById('ncARrow');
      var dims = document.getElementById('ncARdims');
      var wrap = document.getElementById('ncAR');
      var btn = document.getElementById('ncARbtn');
      var now = document.getElementById('ncARnow');

      function setOpen(v) {
        wrap.classList.toggle('open', !!v);
        btn.setAttribute('aria-expanded', v ? 'true' : 'false');
      }
      btn.onclick = function (e) { e.stopPropagation(); setOpen(!wrap.classList.contains('open')); };
      /* Anywhere else, or Escape. A popover over a video preview that needs a
         second press on the same small button to dismiss is one people leave
         open, which is how it ended up feeling permanent in the first place. */
      addEventListener('pointerdown', function (e) {
        if (wrap.classList.contains('open') && !wrap.contains(e.target)) setOpen(false);
      }, true);
      addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && wrap.classList.contains('open')) setOpen(false);
      });

      function store() { return window.__ncStore; }
      function settings() {
        var st = store();
        return st ? st.getState().settings : null;
      }

      /* Which button is lit is derived from the real dimensions rather than
         remembered separately — one source of truth, so it cannot disagree
         with the project it is describing. */
      function activeIndex() {
        var s = settings();
        if (!s || !s.width || !s.height) return 0;
        var r = s.width / s.height;
        for (var i = 1; i < RATIOS.length; i++) {
          if (Math.abs(RATIOS[i][1] - r) < 0.01) return i;
        }
        return 0;
      }

      function render() {
        var active = activeIndex();
        row.innerHTML = RATIOS.map(function (r, i) {
          return '<button type="button" data-i="' + i + '"' +
            (i === active ? ' class="on"' : '') + '>' + r[0] + '</button>';
        }).join('');
        row.querySelectorAll('button').forEach(function (b) {
          b.onclick = function () { select(+b.dataset.i); };
        });
        var s = settings();
        dims.textContent = s && s.width ? s.width + ' x ' + s.height : '';
        /* The trigger says what is on, so collapsing it costs no information —
           which is the only reason collapsing it is allowed. */
        now.textContent = RATIOS[active][0] === 'Free'
          ? (s && s.width ? s.width + '×' + s.height : 'Free')
          : RATIOS[active][0];
      }

      function select(i) {
        var st = store();
        if (!st) return;
        var ratio = RATIOS[i][1];
        if (ratio > 0) {
          var s = st.getState().settings;
          var long = Math.max(s.width || 1920, s.height || 1080);
          var w, h;
          if (ratio >= 1) { w = long; h = Math.round(long / ratio); }
          else { h = long; w = Math.round(long * ratio); }
          /* Odd dimensions are refused by most encoders, and the export path
             ends up in one. */
          w -= w % 2; h -= h % 2;
          st.getState().updateSettings({ width: w, height: h });
        }
        render();
        setOpen(false);        // chosen: get out of the way of the picture
      }

      /* --- boot once the app has mounted --- */
      var tries = 0;
      (function boot() {
        var app = document.getElementById('root');
        if (!store() || !app || !app.children.length) {
          if (++tries < 60) setTimeout(boot, 150);
          return;
        }

        /* Anchored inside the preview panel rather than at a fixed offset from
           the top right of the window, where it sat on top of the Export
           button. The preview panel is already position:relative. */
        var label = [].slice.call(document.querySelectorAll('span'))
          .filter(function (e) { return /^preview$/i.test((e.textContent || '').trim()); })[0];
        var host = null;
        for (var n = label; n; n = n.parentElement) {
          if (getComputedStyle(n).position === 'relative') { host = n; break; }
        }
        if (host) {
          host.appendChild(wrap);
          wrap.style.position = 'absolute';
          wrap.style.top = '58px';
          wrap.style.left = '12px';
          wrap.style.right = 'auto';
          wrap.style.alignItems = 'flex-start';
        }

        render();
        /* Keep the lit button honest if the dimensions change from anywhere
           else — the export dialog, a restored session. */
        if (store().subscribe) store().subscribe(function () { render(); });
        setTimeout(function () { wrap.classList.add('show'); }, 600);
      })();
    })();
    </script>


    <!-- ======================================================================
         KEEP THE PROJECT
         ======================================================================
         The bundle autosaves to localStorage every eight seconds and NOTHING
         EVER READS IT BACK. That is the whole reason the editor comes up empty
         after you leave it: the save works, the restore was never written.

         Two more things had to change for "leave them there" to be true.

         The autosave strips each asset's url before storing it
         (assets.map(({url, ...u}) => u)) — correct, because a blob: URL is dead
         the moment the document that made it goes away. But that means the
         clips came back pointing at media that no longer existed. So the media
         itself goes into IndexedDB, which can hold Blobs, and fresh object URLs
         are minted on the way back in.

         And an eight-second timer loses up to eight seconds of work on the way
         out. Saving on pagehide costs nothing and is the moment that actually
         matters.
         ====================================================================== -->
    <script>
    (function () {
      /* ====================================================================
         MANY PROJECTS, NOT ONE
         ====================================================================
         This began as a single autosave under one key, which meant a second
         idea overwrote the first. Projects are now a list: each has an id, a
         name you can change, and its own snapshot; the index carries enough
         to draw a chooser without loading any of them.

         KEY stays exactly what it was so a project saved by the old build is
         not lost — it is picked up on first run and becomes the first entry
         in the list.

         THE PART THAT NEEDED CARE. Media lives in one IndexedDB store shared
         by every project, keyed by asset id, so importing the same clip into
         two projects stores it once. The old sweep deleted every key the
         CURRENT project did not mention — correct when there was only one
         project, and a data-loss bug the moment there are two: opening B and
         saving would delete A's video. The sweep now asks every project what
         it references before deleting anything.
         ==================================================================== */
      var KEY = 'novaclip_project';          // the pre-projects single save
      var LIST = 'novaclip_projects';        // [{id,name,at,clips,thumb}]
      var CUR = 'novaclip_project_current';  // which one is open
      var PRE = 'novaclip_project:';         // per-project snapshot prefix
      var DB = 'ncEditorMedia', STORE = 'files';

      function uid() {
        return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      }
      function readList() {
        try { var v = JSON.parse(localStorage.getItem(LIST) || '[]'); return Array.isArray(v) ? v : []; }
        catch (e) { return []; }
      }
      function writeList(v) {
        try { localStorage.setItem(LIST, JSON.stringify(v)); } catch (e) {}
      }
      function currentId() {
        try { return localStorage.getItem(CUR) || ''; } catch (e) { return ''; }
      }
      function setCurrent(id) {
        try { id ? localStorage.setItem(CUR, id) : localStorage.removeItem(CUR); } catch (e) {}
      }
      function snapKey(id) { return PRE + id; }
      function readSnap(id) {
        try { return JSON.parse(localStorage.getItem(snapKey(id)) || 'null'); } catch (e) { return null; }
      }

      function db() {
        return new Promise(function (res, rej) {
          var r = indexedDB.open(DB, 1);
          r.onupgradeneeded = function () {
            if (!r.result.objectStoreNames.contains(STORE)) r.result.createObjectStore(STORE);
          };
          r.onsuccess = function () { res(r.result); };
          r.onerror = function () { rej(r.error); };
        });
      }
      function tx(mode) {
        return db().then(function (d) { return d.transaction(STORE, mode).objectStore(STORE); });
      }
      function idbPut(id, blob) {
        return tx('readwrite').then(function (st) {
          return new Promise(function (res) { var q = st.put(blob, id); q.onsuccess = q.onerror = function () { res(); }; });
        });
      }
      function idbGet(id) {
        return tx('readonly').then(function (st) {
          return new Promise(function (res) { var q = st.get(id); q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); }; });
        });
      }
      function idbKeys() {
        return tx('readonly').then(function (st) {
          return new Promise(function (res) { var q = st.getAllKeys(); q.onsuccess = function () { res(q.result || []); }; q.onerror = function () { res([]); }; });
        });
      }
      function idbDel(id) {
        return tx('readwrite').then(function (st) {
          return new Promise(function (res) { var q = st.delete(id); q.onsuccess = q.onerror = function () { res(); }; });
        });
      }

      function store() { return window.__ncStore; }
      function assetId(a) { return String(a.id != null ? a.id : (a.name || '') + ':' + (a.size || 0)); }

      /* ---- saving ------------------------------------------------------- */
      var savingMedia = false;

      /* Blob: URLs can be read back with fetch, which is how the actual bytes
         are recovered from an asset that only carries a URL. Done once per
         asset — the id is stable, so re-saving skips what is already stored. */
      function saveMedia(assets) {
        if (savingMedia) return Promise.resolve();
        savingMedia = true;
        return idbKeys().then(function (have) {
          var known = {};
          have.forEach(function (k) { known[String(k)] = true; });
          var jobs = assets.filter(function (a) {
            return a && a.url && /^blob:/.test(a.url) && !known[assetId(a)];
          }).map(function (a) {
            return fetch(a.url).then(function (r) { return r.blob(); })
              .then(function (b) { return idbPut(assetId(a), b); })
              .catch(function () {});
          });
          /* Anything NO PROJECT mentions is gone for good — otherwise every
             clip ever imported stays on disk forever.

             "No project", not "not this one". The media store is shared, and
             sweeping against only the open project meant opening B and saving
             deleted A's video: the file vanished, A's clips came back as gaps,
             and nothing said why. Every saved snapshot gets a vote. */
          var live = {};
          assets.forEach(function (a) { live[assetId(a)] = true; });
          readList().forEach(function (p) {
            var sn = readSnap(p.id);
            (sn && sn.assets || []).forEach(function (a) {
              if (a && a.__ncid) live[String(a.__ncid)] = true;
            });
          });
          have.forEach(function (k) { if (!live[String(k)]) jobs.push(idbDel(k)); });
          return Promise.all(jobs);
        }).then(function () { savingMedia = false; }, function () { savingMedia = false; });
      }

      /* The store's own limits on the timeline zoom, repeated here because a
         number read back off disk has not been through setZoom. */
      function zoomOf(v, fallback) {
        v = Number(v);
        if (!isFinite(v) || v <= 0) return fallback;
        return Math.max(8, Math.min(400, v));
      }

      function snapshot() {
        var s = store() && store().getState();
        if (!s) return null;
        return {
          tracks: s.tracks, clips: s.clips, markers: s.markers, settings: s.settings,
          assets: (s.assets || []).map(function (a) {
            var c = {}; for (var k in a) if (k !== 'url' && k !== 'file') c[k] = a[k];
            c.__ncid = assetId(a);
            return c;
          }),
          /* Everything above is the film. This is where you were standing when
             you walked out: how far the timeline was zoomed in, which of the
             two layouts was open, where the playhead sat, whose panel was
             showing, and the export settings picked for THIS project rather
             than for the editor in general.

             Clips are saved wholesale, so every cut, fade, speed change,
             filter, chroma key, caption and keyframe already comes back — they
             live on the clip. These five do not live on anything, and without
             them re-opening a project lands you zoomed right out at frame zero
             with nothing selected, which is coming back to a different room
             even though all the furniture is there. */
          view: {
            pixelsPerSecond: s.pixelsPerSecond,
            mode: s.mode,
            playhead: s.playhead,
            selectedClipId: s.selectedClipId,
            exportSettings: s.exportSettings
          },
          at: Date.now()
        };
      }

      /* A still off the preview, small and lossy on purpose: it only has to be
         recognisable at 160px in a list, and a hundred full-size frames in
         localStorage would blow the quota that the projects themselves need. */
      function thumb() {
        try {
          var best = null, area = 0;
          var all = document.querySelectorAll('canvas');
          for (var i = 0; i < all.length; i++) {
            var r = all[i].getBoundingClientRect();
            if (r.width < 80 || r.height < 80) continue;
            if (r.width * r.height > area) { area = r.width * r.height; best = all[i]; }
          }
          if (!best) return '';
          var c = document.createElement('canvas');
          var w = 160, h = Math.max(1, Math.round(w * best.height / best.width));
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(best, 0, 0, w, h);
          return c.toDataURL('image/jpeg', 0.5);
        } catch (e) { return ''; }   // a tainted canvas throws; a list without
                                     // pictures is still a working list
      }

      function touchIndex(id, patch) {
        var list = readList();
        var row = list.filter(function (p) { return p.id === id; })[0];
        if (!row) { row = { id: id, name: 'Untitled Project', at: 0, clips: 0, thumb: '' }; list.unshift(row); }
        for (var k in patch) row[k] = patch[k];
        /* Most recent first, because that is the one being looked for. */
        list.sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
        writeList(list);
        return row;
      }

      function save() {
        var snap = snapshot();
        if (!snap) return;
        var hasWork = (snap.clips && snap.clips.length) || (snap.assets && snap.assets.length);
        var id = currentId();
        if (!id) {
          if (!hasWork) return;          // an empty editor is not a project
          id = uid(); setCurrent(id);
          touchIndex(id, { name: freshName(), at: Date.now(), clips: 0, thumb: '' });
        }
        try {
          if (hasWork) {
            localStorage.setItem(snapKey(id), JSON.stringify(snap));
            var patch = { at: snap.at, clips: (snap.clips || []).length, thumb: thumb() };
            var auto = autoName(snap);
            if (auto) patch.name = auto;
            touchIndex(id, patch);
          }
          /* Deliberately NOT deleting an emptied project here. Clearing the
             timeline is something people do on the way to rebuilding it, and
             a save that fires on pagehide would take the project with it. It
             goes only when it is deleted on purpose. */
        } catch (e) {
          /* Quota. The snapshot matters more than the picture, so drop every
             thumbnail and try once more before giving up. */
          try {
            var l = readList();
            l.forEach(function (p) { p.thumb = ''; });
            writeList(l);
            localStorage.setItem(snapKey(id), JSON.stringify(snap));
          } catch (e2) {}
        }
        var s = store().getState();
        if (hasWork) saveMedia(s.assets || []);
        paintBtn();
        syncTitle();
      }
      /* A list of five things all called "Untitled Project" is not a list. A
         project keeps whatever name it is given, but until it is given one it
         takes the name of the first thing put into it — which is nearly always
         what the person would have typed anyway. */
      function autoName(snap) {
        var row = readList().filter(function (p) { return p.id === currentId(); })[0];
        if (!row || !/^Untitled Project( \d+)?$/.test(row.name || '')) return null;
        var first = (snap.assets || [])[0];
        var from = first && first.name;
        if (!from) {
          var t = (snap.clips || []).filter(function (c) { return c.kind === 'text' && c.text && c.text.content; })[0];
          from = t && t.text.content;
        }
        if (!from) return null;
        return String(from).replace(/\.[a-z0-9]{2,5}$/i, '').trim().slice(0, 60) || null;
      }

      function freshName() {
        var names = {};
        readList().forEach(function (p) { names[p.name] = true; });
        if (!names['Untitled Project']) return 'Untitled Project';
        for (var i = 2; i < 500; i++) if (!names['Untitled Project ' + i]) return 'Untitled Project ' + i;
        return 'Untitled Project';
      }

      /* pagehide covers navigation, tab close and the mobile case where a
         backgrounded tab is killed without ever firing unload. */
      addEventListener('pagehide', save);
      document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });

      /* ---- restoring ---------------------------------------------------- */

      /* A project saved before there were projects. It is moved into the list
         rather than read in place, so there is exactly one shape to maintain
         from here on, and the old key is left alone in case an older build of
         the page is still being served from a cache somewhere. */
      function migrate() {
        var raw;
        try { raw = localStorage.getItem(KEY); } catch (e) { return; }
        if (!raw) return;
        if (readList().length) return;          // already migrated
        var snap;
        try { snap = JSON.parse(raw); } catch (e) { return; }
        if (!snap || !((snap.clips && snap.clips.length) || (snap.assets && snap.assets.length))) return;
        var id = uid();
        try { localStorage.setItem(snapKey(id), raw); } catch (e) { return; }
        touchIndex(id, { name: 'My first project', at: snap.at || Date.now(),
                         clips: (snap.clips || []).length, thumb: '' });
        setCurrent(id);
      }

      function restore(explicitId) {
        var id = explicitId || currentId();
        if (!id) { var first = readList()[0]; id = first && first.id; }
        if (!id) return;
        var snap = readSnap(id);
        if (!snap || !((snap.clips && snap.clips.length) || (snap.assets && snap.assets.length))) return;

        var st = store();
        if (!st) return;
        var cur = st.getState();
        /* Never overwrite work in progress. If the editor already has clips —
           a file was dropped before this ran — the session on disk is the
           older one and loses. Opening a project on purpose is different: the
           caller has already saved and cleared, and says so. */
        if (!explicitId && cur.clips && cur.clips.length) return;
        setCurrent(id);

        var assets = snap.assets || [];
        Promise.all(assets.map(function (a) {
          return idbGet(a.__ncid).then(function (blob) {
            if (!blob) return null;
            var c = {}; for (var k in a) if (k !== '__ncid') c[k] = a[k];
            c.url = URL.createObjectURL(blob);
            return c;
          });
        })).then(function (list) {
          var live = list.filter(Boolean);
          var ok = {};
          live.forEach(function (a) { ok[String(a.id)] = true; });
          /* A clip whose media did not come back would render as a black hole
             on the timeline, so it is dropped rather than shown broken. */
          var clips = (snap.clips || []).filter(function (c) {
            return c.assetId == null || ok[String(c.assetId)];
          });
          if (!live.length && !clips.length) return;

          var view = snap.view || {};
          /* A selection pointing at a clip that did not come back would open
             the properties panel on nothing. */
          var sel = null;
          for (var i = 0; i < clips.length; i++)
            if (clips[i].id === view.selectedClipId) { sel = clips[i].id; break; }
          /* And the playhead is held inside what actually survived, so a
             project never opens on black with no sign that it has anything in
             it. */
          var end = clips.reduce(function (m, c) { return Math.max(m, c.start + c.duration); }, 0);
          var at = Number(view.playhead);
          if (!isFinite(at) || at < 0) at = 0;

          st.setState({
            assets: live,
            clips: clips,
            tracks: snap.tracks && snap.tracks.length ? snap.tracks : cur.tracks,
            markers: snap.markers || cur.markers,
            settings: Object.assign({}, cur.settings, snap.settings || {}),
            pixelsPerSecond: zoomOf(view.pixelsPerSecond, cur.pixelsPerSecond),
            mode: view.mode === 'simple' || view.mode === 'complex' ? view.mode : cur.mode,
            playhead: Math.min(at, end),
            selectedClipId: sel,
            /* Restoring is arriving, not resuming: nobody wants a project to
               start playing at them because it was playing when they left. */
            isPlaying: false,
            exportSettings: Object.assign({}, cur.exportSettings, view.exportSettings || {})
          });

          var dropped = (snap.clips || []).length - clips.length;
          if (window.toast) {
            toast(dropped
              ? 'Project restored — ' + dropped + ' clip' + (dropped > 1 ? 's' : '') + ' lost their media'
              : 'Project restored from last time');
          }
        }).catch(function () {});
      }

      /* ====================================================================
         THE CHOOSER
         ====================================================================
         Outside React, like the aspect control, for the same reason: the
         bundle is compiled and a button inside it is a 397 kB re-paste.
         ==================================================================== */
      var panel = null;

      /* The bundle's own title: a span inside a button, up in the toolbar. Its
         classes are generated and change on every rebuild, so it cannot be
         found by selector — and it cannot be found by its text either, which
         is the mistake that put the Projects button in the bottom-left corner:
         the match was /project|untitled/, and the moment a project is renamed
         to "Skate edit" that stops matching, so the search wandered off and
         found something else entirely near the foot of the page.

         So: matched once, by where it is and what it says before anything has
         renamed it, and then remembered. The node survives renames because
         React updates its text rather than replacing it. */
      /* The toolbar title is an <input>, not a label — which is why hunting
         for the text in the DOM found nothing but our own button's caption and
         anchored the button beside itself in the bottom-left corner. An
         input's text is its value; textContent is empty.

         That it is an input is good news: it is already the editor's rename
         box, so there is no second one to build and no two names to reconcile.
         Typing in it renames the project in the list. */
      var _title = null;
      function titleEl() {
        if (_title && _title.isConnected) return _title;
        _title = null;
        var row = readList().filter(function (p) { return p.id === currentId(); })[0];
        var want = (row && row.name) || '';
        var all = document.querySelectorAll('input[type="text"], input:not([type])');
        for (var i = 0; i < all.length; i++) {
          var e = all[i];
          if (e.closest('#ncpj')) continue;
          var r = e.getBoundingClientRect();
          if (!r.width || r.top > 130) continue;          // toolbar only
          var v = (e.value || '').trim();
          if (v === want || /^untitled project/i.test(v)) { _title = e; break; }
        }
        if (_title && !_title.__ncBound) {
          _title.__ncBound = true;
          /* Renaming in the toolbar is renaming the project. Debounced because
             this fires per keystroke and each one rewrites the index. */
          var t = null;
          _title.addEventListener('input', function () {
            clearTimeout(t);
            t = setTimeout(function () {
              var id = currentId(); if (!id) return;
              var v = (_title.value || '').trim().slice(0, 60) || 'Untitled Project';
              touchIndex(id, { name: v });
              paintBtn();
            }, 400);
          });
        }
        return _title;
      }

      /* React owns that input, so assigning .value is silently reverted on the
         next render. The native setter plus an input event is what makes React
         accept a value it did not type itself. */
      function setTitleValue(el, v) {
        try {
          var d = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
          d && d.set ? d.set.call(el, v) : (el.value = v);
          el.dispatchEvent(new Event('input', { bubbles: true }));
        } catch (e) { el.value = v; }
      }

      function esc(t) {
        return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function ago(t) {
        if (!t) return 'never opened';
        var d = Date.now() - t, m = Math.round(d / 60000);
        if (m < 1) return 'just now';
        if (m < 60) return m + ' min ago';
        var h = Math.round(m / 60);
        if (h < 24) return h + 'h ago';
        return Math.round(h / 24) + 'd ago';
      }

      /* Everything that swaps projects goes through here: save what is open,
         empty the editor, then load. Skipping the save is how a project loses
         the last thing done to it. */
      function openProject(id) {
        save();
        var st = store(); if (!st) return;
        st.setState({ clips: [], assets: [], markers: [], selectedClipId: null,
                      playhead: 0, past: [], future: [] });
        setCurrent(id);
        setTimeout(function () { restore(id); draw(); syncTitle(); }, 30);
      }

      function newProject() {
        save();
        var st = store(); if (!st) return;
        var id = uid();
        touchIndex(id, { name: freshName(), at: Date.now(), clips: 0, thumb: '' });
        setCurrent(id);
        st.setState({ clips: [], assets: [], markers: [], selectedClipId: null,
                      playhead: 0, past: [], future: [] });
        draw();
        syncTitle();
        if (window.toast) toast('New project started');
      }

      function renameProject(id) {
        var row = readList().filter(function (p) { return p.id === id; })[0];
        var name = prompt('Name this project', (row && row.name) || 'Untitled Project');
        if (name == null) return;
        name = name.trim().slice(0, 60) || 'Untitled Project';
        touchIndex(id, { name: name });
        draw();
        syncTitle();
      }

      /* Keep the header reading the same thing as the chooser. Without this a
         project called "Skate edit" in the list still says "Untitled Project"
         across the top, and the two disagree about what is open. */
      function syncTitle() {
        var el = titleEl();
        if (!el) return;
        var row = readList().filter(function (p) { return p.id === currentId(); })[0];
        if (row && row.name && (el.value || '').trim() !== row.name) setTitleValue(el, row.name);
      }

      function deleteProject(id) {
        var row = readList().filter(function (p) { return p.id === id; })[0];
        if (!confirm('Delete "' + ((row && row.name) || 'this project') +
                     '"? The clips and the media it used are removed. This cannot be undone.')) return;
        writeList(readList().filter(function (p) { return p.id !== id; }));
        try { localStorage.removeItem(snapKey(id)); } catch (e) {}
        if (currentId() === id) {
          setCurrent('');
          var st = store();
          if (st) st.setState({ clips: [], assets: [], markers: [], selectedClipId: null,
                                playhead: 0, past: [], future: [] });
        }
        /* Media the deleted project owned alone is now unreferenced; this is
           the sweep that collects it. */
        var st2 = store();
        if (st2) saveMedia(st2.getState().assets || []);
        draw();
      }

      function draw() {
        if (!panel) return;
        var list = readList(), cur = currentId();
        var body = panel.querySelector('#ncpj-list');
        body.innerHTML = list.length ? list.map(function (p) {
          return '<div class="ncpj-row' + (p.id === cur ? ' on' : '') + '" data-id="' + esc(p.id) + '">' +
            (p.thumb ? '<img src="' + esc(p.thumb) + '" alt="">' : '<span class="ncpj-noimg"></span>') +
            '<span class="ncpj-meta"><b>' + esc(p.name) + '</b>' +
            '<i>' + (p.clips || 0) + ' clip' + (p.clips === 1 ? '' : 's') + ' · ' + ago(p.at) +
            (p.id === cur ? ' · open' : '') + '</i></span>' +
            '<span class="ncpj-acts">' +
              '<button type="button" data-act="rename" title="Rename">Rename</button>' +
              '<button type="button" data-act="del" title="Delete">Delete</button>' +
            '</span></div>';
        }).join('') : '<p class="ncpj-empty">No projects yet. Whatever you make is saved here ' +
                      'automatically — drop a clip on the timeline and it appears.</p>';

        body.querySelectorAll('.ncpj-row').forEach(function (r) {
          r.onclick = function (e) {
            var act = e.target.getAttribute && e.target.getAttribute('data-act');
            var id = r.dataset.id;
            if (act === 'rename') { e.stopPropagation(); renameProject(id); return; }
            if (act === 'del') { e.stopPropagation(); deleteProject(id); return; }
            if (id !== currentId()) openProject(id);
            close();
          };
        });
        syncTitle();
        paintBtn();
      }

      /* The label lives on the button, not in the panel, so it cannot be left
         to draw() — that only runs while the chooser is open. A project named
         from its first clip would otherwise still read "Untitled Project" in
         the header until you opened the list. */
      function paintBtn() {
        var el = document.getElementById('ncpj-now');
        if (!el) return;
        var row = readList().filter(function (p) { return p.id === currentId(); })[0];
        el.textContent = (row && row.name) || 'Untitled Project';
      }

      function open_() { panel.classList.add('show'); draw(); }
      function close() { panel.classList.remove('show'); }

      function buildUI() {
        if (panel) return;
        var st = document.createElement('style');
        st.textContent =
          '#ncpj-btn{position:fixed;top:14px;left:50%;transform:translateX(-190px);z-index:9999;' +
            'display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:9px;cursor:pointer;' +
            'font:600 12px/1 Geist,Inter,system-ui,sans-serif;' +
            'border:1px solid rgba(255,255,255,.14);background:rgba(12,14,24,.9);color:#EAF2FF;' +
            'backdrop-filter:blur(12px)}' +
          '#ncpj-btn:hover{border-color:rgba(0,240,255,.55)}' +
          'html[data-theme="light"] #ncpj-btn{background:rgba(255,255,255,.95);color:#101828;' +
            'border-color:rgba(16,24,44,.16)}' +
          '#ncpj{position:fixed;inset:0;z-index:10000;display:none;place-items:center;' +
            'background:rgba(4,6,12,.72);backdrop-filter:blur(8px);padding:24px;' +
            'font:400 13px/1.5 Geist,Inter,system-ui,sans-serif}' +
          '#ncpj.show{display:grid}' +
          '#ncpj .ncpj-box{width:100%;max-width:520px;max-height:80vh;overflow:auto;' +
            'background:#0C1220;border:1px solid rgba(255,255,255,.13);border-radius:18px;padding:20px;' +
            'color:#EAF2FF}' +
          'html[data-theme="light"] #ncpj .ncpj-box{background:#fff;color:#101828;' +
            'border-color:rgba(16,24,44,.14)}' +
          '#ncpj h3{font-size:1.05rem;font-weight:700;margin:0 0 3px}' +
          '#ncpj .ncpj-sub{opacity:.6;font-size:12px;margin-bottom:14px}' +
          '#ncpj .ncpj-row{display:flex;align-items:center;gap:11px;padding:9px;border-radius:12px;' +
            'cursor:pointer;border:1px solid transparent}' +
          '#ncpj .ncpj-row:hover{background:rgba(127,127,127,.12)}' +
          '#ncpj .ncpj-row.on{border-color:rgba(0,240,255,.5);background:rgba(0,240,255,.08)}' +
          '#ncpj .ncpj-row img,#ncpj .ncpj-noimg{width:64px;height:38px;border-radius:7px;flex:0 0 auto;' +
            'object-fit:cover;background:rgba(127,127,127,.22)}' +
          '#ncpj .ncpj-meta{flex:1;min-width:0}' +
          '#ncpj .ncpj-meta b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;' +
            'text-overflow:ellipsis}' +
          '#ncpj .ncpj-meta i{font-style:normal;opacity:.55;font-size:11.5px}' +
          '#ncpj .ncpj-acts{display:flex;gap:6px;flex:0 0 auto;opacity:0;transition:opacity .15s}' +
          '#ncpj .ncpj-row:hover .ncpj-acts{opacity:1}' +
          '#ncpj .ncpj-acts button{font:inherit;font-size:11px;padding:5px 9px;border-radius:7px;' +
            'cursor:pointer;border:1px solid rgba(127,127,127,.3);background:none;color:inherit}' +
          '#ncpj .ncpj-acts button:hover{border-color:rgba(255,80,110,.6);color:#FF6B81}' +
          '#ncpj .ncpj-acts button[data-act="rename"]:hover{border-color:rgba(0,240,255,.6);color:#00E5FF}' +
          '#ncpj .ncpj-empty{opacity:.6;padding:14px 4px;line-height:1.7}' +
          '#ncpj .ncpj-foot{display:flex;gap:9px;margin-top:14px}' +
          '#ncpj .ncpj-foot button{flex:1;font:inherit;font-weight:650;padding:11px;border-radius:11px;' +
            'cursor:pointer;border:0;background:linear-gradient(110deg,#7C5CFF,#00E5FF);color:#05070E}' +
          '#ncpj .ncpj-foot button.q{background:none;border:1px solid rgba(127,127,127,.32);color:inherit;flex:0 0 auto}';
        document.head.appendChild(st);

        var b = document.createElement('button');
        b.id = 'ncpj-btn'; b.type = 'button';
        b.innerHTML = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" ' +
          'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>' +
          '<span id="ncpj-now">Untitled Project</span>';
        b.onclick = open_;
        /* Beside the editor's own project title, in the header's flow, rather
           than at a fixed offset guessed from the middle of the window. The
           aspect control was written the second way first and sat on top of
           the Export button; a coordinate that happens to look right in one
           window is not a position. */
        document.body.appendChild(b);     // somewhere, immediately

        /* Then move it into the header once the header exists. React mounts
           the store before it has finished painting the toolbar, so the first
           look often finds nothing — which is how this ended up floating at a
           guessed coordinate over the title it was supposed to sit beside. */
        (function anchor(n) {
          var t = titleEl();
          /* Beside the input, or beside whatever wraps it. */
          var host = t && (t.parentElement && t.parentElement.children.length <= 3
            ? t.parentElement : t);
          if (host && host.parentElement) {
            host.parentElement.insertBefore(b, host.nextSibling);
            b.style.position = 'static';
            b.style.transform = 'none';
            b.style.marginLeft = '8px';
            return;
          }
          if ((n || 0) < 40) setTimeout(function () { anchor((n || 0) + 1); }, 150);
        })(0);

        panel = document.createElement('div');
        panel.id = 'ncpj';
        panel.innerHTML =
          '<div class="ncpj-box">' +
            '<h3>Projects</h3>' +
            '<p class="ncpj-sub">Everything is kept in this browser, on this device. ' +
              'Pick one up where you left it, or start another.</p>' +
            '<div id="ncpj-list"></div>' +
            '<div class="ncpj-foot">' +
              '<button type="button" id="ncpj-new">New project</button>' +
              '<button type="button" class="q" id="ncpj-close">Close</button>' +
            '</div>' +
          '</div>';
        document.body.appendChild(panel);
        panel.querySelector('#ncpj-new').onclick = function () { newProject(); close(); };
        panel.querySelector('#ncpj-close').onclick = close;
        panel.onclick = function (e) { if (e.target === panel) close(); };
        addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && panel.classList.contains('show')) close();
        });
        draw();
      }

      /* The store only exists once React has mounted and run its effects. */
      (function wait(n) {
        if (store()) { migrate(); restore(); buildUI(); setTimeout(syncTitle, 200); return; }
        if ((n || 0) < 60) setTimeout(function () { wait((n || 0) + 1); }, 150);
      })(0);
    })();
    </script>

    <script src="nova.js"></script>
<script src='biometric.js' defer></script>
<script src='jarvis.js' defer></script>
  </body>
</html>
