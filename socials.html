<!DOCTYPE html>
<html lang='en'>
<head>
<script>/* Theme before first paint. nova.js runs at the end of <body>, so a theme
   applied there lands after the page has already been painted dark — a white
   flash on every navigation for anyone using light mode. Six lines here cost
   nothing and remove it. Kept in sync with ncApplyTheme() in nova.js. */
(function(){try{var p=localStorage.getItem('nc_theme')||'system';
var b=localStorage.getItem('nc_skin_bg');
var t=(p==='light'||p==='dark')?p:(b?'dark':(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
var r=document.documentElement;r.setAttribute('data-theme',t);r.setAttribute('data-theme-pref',p);
r.style.colorScheme=t;
/* A cyber skin repaints the palette from nova.js, which runs at the end of
   <body>. Painting its background here, before the first frame, is what stops
   every navigation flashing the default dark first. */
if(b){r.style.background=b;r.setAttribute('data-skin',p);}}catch(e){}})();</script>
<meta charset='UTF-8'>
<!-- Google Analytics 4 (gtag.js) — measurement ID G-QN1QE08F2K.
     In the head on every page, which is where Google's own snippet goes: it
     loads async so it never blocks a paint, and page_view fires without any
     further wiring.

     THIS IS WHY privacy.html CHANGED IN THE SAME COMMIT. That page said there
     was no analytics on NovaClip. From here that is not true, and a policy
     that quietly drifts from what the software does is a promise being broken
     without telling anybody. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QN1QE08F2K"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-QN1QE08F2K');
</script>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<!-- PWA. The manifest and the icons sit at the site root so they resolve at
     https://novaclip.org/manifest.json and /icons/..., which is what an install
     prompt and PWABuilder look for. The service worker is registered at the end
     of nova.js, which all 24 pages already load. -->
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050505">
<title>Socials — NovaClip</title>
<meta name='description' content='Community and Gifts in one place.'>
<link rel='icon' href='logo.svg' type='image/svg+xml'>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--ink:var(--nc-bg,#05070E);--panel:var(--nc-bg2,#0C1220);--line:rgba(255,255,255,.1);--txt:var(--nc-text,#E8EEFF);--dim:var(--nc-dim2,#8A97B4);
  --cyan:var(--nc-cyan2,#00E5FF);--violet:var(--nc-violet,#7C5CFF);--pink:var(--nc-pink,#FF3D9A);
  --grad:linear-gradient(110deg,var(--violet),var(--cyan) 48%,var(--pink))}
html,body{height:100%}
body{background:var(--ink);color:var(--txt);overflow:hidden;
  font-family:'Geist','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
/* nova.js drives the rail width; 200px is the fallback for a load before it runs */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--nc-rail,200px);z-index:998;
  background:rgba(12,12,16,.85);backdrop-filter:blur(20px);display:flex;flex-direction:column;
  padding:20px 0;gap:4px;border-right:1px solid rgba(255,255,255,.06);overflow-y:auto}
.sidebar .themewrap{margin-top:auto;padding:16px 20px}
.shell{margin-left:var(--nc-rail,200px);height:100vh;display:flex;flex-direction:column}
/* A segmented control rather than folder tabs. One moving indicator instead of
   a background swap per button: the eye follows the movement and knows where it
   came from, which a hard swap never tells you. */
.tabs{display:flex;gap:12px;align-items:center;flex-shrink:0;
  padding:14px clamp(14px,2vw,26px) 12px}
.tabnav{position:relative;display:flex;gap:3px;padding:5px;border-radius:16px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tabnav .ind{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:12px;
  background:var(--grad);z-index:0;box-shadow:0 6px 20px -8px rgba(0,240,255,.75);
  transform:translateX(0)}
@media (prefers-reduced-motion:no-preference){
  .tabnav .ind{transition:transform .34s cubic-bezier(.2,.9,.3,1.1),
    width .34s cubic-bezier(.2,.9,.3,1.1)}
  .tabnav button svg{transition:transform .3s cubic-bezier(.2,.9,.3,1.3)}
  .tabnav button.on svg{transform:scale(1.12)}
}
.tabnav button{position:relative;z-index:1;display:flex;align-items:center;gap:8px;
  padding:9px 18px;border:0;border-radius:12px;background:transparent;color:var(--dim);
  cursor:pointer;font:600 14px/1 inherit;white-space:nowrap;transition:color .22s}
.tabnav button svg{width:16px;height:16px;fill:none;stroke:currentColor;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabnav button:hover:not(.on){color:var(--txt)}
.tabnav button.on{color:#04121a}
.tabnav button:focus-visible{outline:2px solid var(--cyan,#00F0FF);outline-offset:3px}
.tabmeta{color:var(--dim);font-size:.82rem;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tabmeta b{color:var(--txt);font-weight:600}
.tabspin{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);
  border-top-color:var(--cyan,#00F0FF);display:inline-block;vertical-align:-2px;
  margin-right:7px;animation:tabspin .7s linear infinite}
@keyframes tabspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.tabspin{animation-duration:2.4s}}
.frames{flex:1;min-height:0;border-top:1px solid var(--line);position:relative}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--ink)}
.frames iframe.on{display:block}
@media (max-width:760px){
  .shell{margin-left:0;height:calc(100vh - 64px)}
  .tabs{padding:8px 10px}
  .tabnav{flex:1}
  .tabnav button{flex:1;justify-content:center;padding:9px 8px;font-size:13px}
  .tabmeta{display:none}
}
</style>
</head>
<body>
<div class='sidebar'>
  <div class='themewrap'>
    <label data-t='language'>Language</label>
    <select id='langpick'></select>
  </div>
</div>

<div class='shell'>
  <div class='tabs'>
    <div class='tabnav' id='tabs' role='tablist'><span class='ind' id='tabInd'></span></div>
    <span class='tabmeta' id='tabMeta'></span>
  </div>
  <div class='frames' id='frames'></div>
</div>

<script src='nova.js'></script>
<script src='biometric.js' defer></script>
<script src='jarvis.js' defer></script>
<script>
/* Two pages, one address. The tab you are on is in the URL as #<name>, so a
   link or a reload lands where you left rather than always on the first tab. */
const TABS = [{"key": "community", "label": "Community", "src": "community.html?embed=1", "icon": "<path d=\"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/><path d=\"M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75\"/>", "note": "Posts and replies from other NovaClip creators."}, {"key": "gifts", "label": "Gifts", "src": "gift.html?embed=1", "icon": "<path d=\"M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z\"/><path d=\"M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z\"/>", "note": "Rewards you have unlocked, and what is next."}];

const tabs = document.getElementById('tabs');
const frames = document.getElementById('frames');

const ind = document.getElementById('tabInd');
const meta = document.getElementById('tabMeta');

TABS.forEach((t, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.setAttribute('role', 'tab');
  b.setAttribute('aria-selected', 'false');
  /* Roving tabindex: one stop for the whole group, then arrow keys inside it.
     Making every tab tabbable is what turns a two-tab nav into two extra tab
     stops on the way to the content. */
  b.tabIndex = -1;
  b.dataset.k = t.key;
  b.innerHTML = (t.icon ? '<svg viewBox="0 0 24 24">' + t.icon + '</svg>' : '') +
    '<span>' + t.label + '</span>';
  tabs.appendChild(b);

  const f = document.createElement('iframe');
  f.dataset.k = t.key;
  f.title = t.label;
  /* Only the first frame loads now. The other one loads the first time it is
     asked for — two heavy pages booting at once is a slow, janky open. */
  if (i === 0) f.src = t.src;
  else f.dataset.src = t.src;
  frames.appendChild(f);
});

/* The indicator is positioned from the real button box rather than from an
   index times a guessed width — the labels are translated, so their widths are
   not knowable in advance. */
function moveIndicator(btn) {
  if (!btn || !ind) return;
  ind.style.width = btn.offsetWidth + 'px';
  ind.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
}

function show(key) {
  const t = TABS.find(x => x.key === key) || TABS[0];
  let current = null;
  tabs.querySelectorAll('button').forEach(b => {
    const on = b.dataset.k === t.key;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
    b.tabIndex = on ? 0 : -1;
    if (on) current = b;
  });
  moveIndicator(current);

  frames.querySelectorAll('iframe').forEach(f => {
    const on = f.dataset.k === t.key;
    f.classList.toggle('on', on);
    if (on && !f.src && f.dataset.src) {
      /* First open of this tab: say it is coming rather than showing a blank
         panel while a whole page boots inside the frame. */
      if (meta) meta.innerHTML = '<span class="tabspin"></span>Loading ' + t.label + '…';
      f.addEventListener('load', function () {
        if (meta && f.classList.contains('on')) meta.innerHTML = t.note || '';
      }, { once: true });
      f.src = f.dataset.src;
    } else if (on && meta) {
      meta.innerHTML = t.note || '';
    }
  });
  if (location.hash.slice(1) !== t.key) history.replaceState(null, '', '#' + t.key);
  document.title = t.label + ' — NovaClip';
}

tabs.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) show(b.dataset.k);
});

/* Arrow keys move between tabs, which is what a role="tablist" promises a
   screen reader it will do. */
tabs.addEventListener('keydown', e => {
  const keys = { ArrowRight: 1, ArrowLeft: -1, Home: 'first', End: 'last' };
  if (!(e.key in keys)) return;
  e.preventDefault();
  const btns = [...tabs.querySelectorAll('button')];
  const i = btns.findIndex(b => b.classList.contains('on'));
  let next;
  if (keys[e.key] === 'first') next = 0;
  else if (keys[e.key] === 'last') next = btns.length - 1;
  else next = (i + keys[e.key] + btns.length) % btns.length;
  show(btns[next].dataset.k);
  btns[next].focus();
});

/* The rail resizes with the viewport, so the button the indicator sits on
   moves. Without this it detaches on the first resize. */
addEventListener('resize', () => moveIndicator(tabs.querySelector('button.on')));
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1) || TABS[0].key);
</script>
</body>
</html>
