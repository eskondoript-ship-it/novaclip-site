<!DOCTYPE html>
<html lang='en'>
<head>
<script>/* Theme before first paint. nova.js runs at the end of <body>, so a theme
   applied there lands after the page has already been painted dark — a white
   flash on every navigation for anyone using light mode. Six lines here cost
   nothing and remove it. Kept in sync with ncApplyTheme() in nova.js. */
(function(){try{var p=localStorage.getItem('nc_theme')||'system';
var t=(p==='light'||p==='dark')?p:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
var r=document.documentElement;r.setAttribute('data-theme',t);r.setAttribute('data-theme-pref',p);
r.style.colorScheme=t;}catch(e){}})();</script>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Photo — NovaClip</title>
<meta name='description' content='A layered image editor in the browser. Layers, blend modes, non-destructive adjustments, filters, selections and text. Nothing is uploaded.'>
<link rel='icon' href='logo.svg' type='image/svg+xml'>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:var(--nc-bg,#05070E); --panel:var(--nc-bg2,#0C1220);
  --panel2:rgba(255,255,255,.04); --line:rgba(255,255,255,.10);
  --txt:var(--nc-text,#EAF2FF); --dim:var(--nc-dim,#8A97B4);
  --cyan:var(--nc-cyan,#00F0FF); --pink:var(--nc-pink,#FF2E97);
  --lime:var(--nc-lime,#B6FF3C); --amber:#FFB443;
  --r:12px;
}
html,body{height:100%}
body{background:var(--ink);color:var(--txt);
  font:15px/1.5 Geist,Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}

.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--nc-rail,200px);z-index:998;
  background:rgba(12,12,16,.85);backdrop-filter:blur(20px);display:flex;flex-direction:column;
  padding:20px 0;gap:4px;border-right:1px solid rgba(255,255,255,.06);overflow-y:auto}
.sidebar .themewrap{margin-top:auto;padding:16px 20px}
.sidebar .themewrap label{display:block;font-size:.78rem;opacity:.6;margin-bottom:6px}
.sidebar select{width:100%;font-size:.95rem;background:rgba(255,255,255,.05);color:inherit;
  border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:9px}

/* ---- app frame: bar on top, tool rail left, dock right, stage in the middle ---- */
.shell{position:fixed;left:var(--nc-rail,200px);right:0;top:0;bottom:0;
  display:grid;grid-template-rows:auto 1fr;min-width:0}
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--panel);flex-wrap:wrap;
  /* nova.js pins the coin badge at top:16px right:16px with z-index 997, and it
     sat directly on top of Export — the button was visible, looked enabled and
     could not be clicked. Reserve the corner rather than move the badge, which
     every other page positions the same way. */
  padding-right:112px}
.bar .name{font-weight:800;letter-spacing:-.02em;font-size:1.05rem}
.bar .sp{flex:1}
.pill{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:20px;
  background:rgba(0,240,255,.12);color:var(--cyan);font-weight:700}
.pill.warn{background:rgba(255,180,67,.14);color:var(--amber)}

button,.filebtn{font:inherit;font-size:.85rem;font-weight:600;color:var(--txt);
  background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled),.filebtn:hover{border-color:var(--cyan);color:var(--cyan)}
button:disabled{opacity:.4;cursor:default}
button.prim{background:linear-gradient(90deg,var(--cyan),#4CC9F0);color:#04121a;border:0}
button.danger:hover{border-color:var(--pink);color:var(--pink)}
.filebtn{display:inline-block;position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.body{display:grid;grid-template-columns:56px 1fr 280px;min-height:0;min-width:0}
@media (max-width:1100px){.body{grid-template-columns:52px 1fr 240px}}
@media (max-width:820px){
  .body{grid-template-columns:48px 1fr;grid-template-rows:1fr auto}
  .dock{grid-column:1/-1;max-height:44vh}
}

/* ---- tool rail ---- */
.rail{background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;overflow-y:auto}
.rail button{width:40px;height:40px;display:grid;place-items:center;padding:0;
  background:transparent;border:1px solid transparent;border-radius:10px}
.rail button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.rail button.on{background:rgba(0,240,255,.14);color:var(--cyan);border-color:rgba(0,240,255,.35)}
.rail hr{width:24px;border:0;border-top:1px solid var(--line);margin:6px 0}

/* ---- stage ---- */
.stage{position:relative;overflow:hidden;background:
  linear-gradient(45deg,rgba(255,255,255,.03) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.03) 75%),
  linear-gradient(45deg,rgba(255,255,255,.03) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.03) 75%);
  background-size:22px 22px;background-position:0 0,11px 11px;
  display:grid;place-items:center;min-width:0;min-height:0}
#wrap{position:relative;line-height:0;box-shadow:0 24px 70px rgba(0,0,0,.55)}
#view{display:block;image-rendering:auto;touch-action:none;cursor:crosshair}
#overlay{position:absolute;inset:0;pointer-events:none}
.empty{text-align:center;max-width:44ch;padding:28px}
.empty h2{font-size:1.3rem;margin-bottom:8px;letter-spacing:-.02em}
.empty p{color:var(--dim);font-size:.92rem;margin-bottom:16px;line-height:1.7}

/* ---- right dock ---- */
.dock{background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;display:flex;flex-direction:column}
.sect{border-bottom:1px solid var(--line)}
.sect>h3{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  font-weight:700;padding:11px 14px 7px;display:flex;align-items:center;gap:8px}
.sect>h3 .sp{flex:1}
.sect>h3 button{padding:2px 7px;font-size:.7rem;border-radius:6px}
.sect .in{padding:0 14px 14px}

/* layers */
.layer{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;
  border:1px solid transparent;cursor:pointer;margin-bottom:3px}
.layer:hover{background:var(--panel2)}
.layer.on{background:rgba(0,240,255,.10);border-color:rgba(0,240,255,.34)}
.layer .eye{width:22px;height:22px;display:grid;place-items:center;flex:none;
  background:none;border:0;padding:0;color:var(--dim)}
.layer .eye.vis{color:var(--cyan)}
.layer .eye svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
.layer .thumb{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);flex:none;
  background-size:cover;background-position:center;
  background-image:linear-gradient(45deg,#1a2233 25%,transparent 25%,transparent 75%,#1a2233 75%),
  linear-gradient(45deg,#1a2233 25%,#0e1420 25%,#0e1420 75%,#1a2233 75%);
  background-size:10px 10px;background-position:0 0,5px 5px}
.layer .meta{min-width:0;flex:1}
.layer .meta b{display:block;font-size:.82rem;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.layer .meta span{font-size:.68rem;color:var(--dim)}

label.f{display:block;font-size:.74rem;color:var(--dim);margin:9px 0 3px}
input[type=range]{width:100%;accent-color:var(--cyan)}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;font-size:.85rem;
  color:var(--txt);background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:6px 8px}
input[type=color]{width:100%;height:30px;padding:2px;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;cursor:pointer}
.row{display:flex;gap:6px;align-items:center}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.val{font-size:.72rem;color:var(--dim);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.swatches{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.swatches i{width:20px;height:20px;border-radius:5px;border:1px solid var(--line);cursor:pointer;display:block}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{padding:4px 9px;font-size:.75rem;border-radius:20px}
#hist{width:100%;height:64px;display:block;border:1px solid var(--line);border-radius:8px;
  background:rgba(0,0,0,.28)}
.hint{font-size:.72rem;color:var(--dim);line-height:1.55;margin-top:8px}
.hint kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  padding:0 4px;font-size:.68rem;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div class='sidebar'>
  <div class='themewrap'>
    <label data-t='language'>Language</label>
    <select id='langpick'></select>
  </div>
</div>

<div class='shell'>
  <div class='bar'>
    <span class='name'>Photo</span>
    <span class='pill' id='dims'>no image</span>
    <span class='pill' id='zoomPill'>100%</span>
    <span class='sp'></span>
    <label class='filebtn'>Open<input type='file' id='file' accept='image/*'></label>
    <button id='addLayerFile' type='button' disabled>Place image</button>
    <button id='undo' type='button' disabled>Undo</button>
    <button id='redo' type='button' disabled>Redo</button>
    <button id='fit' type='button' disabled>Fit</button>
    <select id='fmt' style='width:auto' disabled>
      <option value='png'>PNG</option>
      <option value='jpeg'>JPEG</option>
      <option value='webp'>WebP</option>
    </select>
    <button id='save' class='prim' type='button' disabled>Export</button>
  </div>

  <div class='body'>
    <div class='rail' id='rail'></div>

    <div class='stage' id='stage'>
      <div class='empty' id='empty'>
        <h2>Nothing open yet</h2>
        <p>Open a picture, or drop one anywhere on this panel. It is decoded in the
           tab and never uploaded — there is no server in this page at all.</p>
        <label class='filebtn'>Choose an image<input type='file' id='file2' accept='image/*'></label>
      </div>
      <div id='wrap' style='display:none'>
        <canvas id='view'></canvas>
        <canvas id='overlay'></canvas>
      </div>
    </div>

    <div class='dock' id='dock'></div>
  </div>
</div>

<script src='nova.js'></script>
<script src='biometric.js' defer></script>
<script src='jarvis.js' defer></script>
<script>
/* ============================================================================
   NovaClip Photo — a layered image editor
   ============================================================================
   WHAT CHANGED AND WHY

   The previous version was one canvas with CSS filters on top. That is fine
   until you need two things at once, and it has a quiet flaw: the filter
   string styles the <canvas> element, so what you see is the browser's
   compositor output while what you export is the raw pixels. They agree until
   a browser rounds differently, and then the exported file does not match the
   screen and nobody can say why.

   Here every adjustment is a real pixel operation, run through the same code
   path for the preview and for the export. What is on screen IS the file.

   ============================================================================
   THE MODEL

     doc     { w, h, layers[], active }
     layer   { id, name, canvas, visible, opacity, blend, adj{}, locked }

   Layers hold raw pixels. Adjustments are stored on the layer, not baked in,
   and applied when the layer is composited — so a slider can be moved back
   without having destroyed anything. The result is cached per layer and
   invalidated when its adjustments or pixels change, because re-running nine
   pixel operations over a 4000px layer on every mouse move is not a thing a
   browser can do at sixty frames a second.

   Filters (sharpen, blur, pixelate…) ARE destructive — they write to the
   layer's pixels. That is the honest split: a slider you can take back, a
   filter you apply on purpose and can undo through history.
   ---------------------------------------------------------------------------- */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var view = $('view'), vctx = view.getContext('2d');
  var overlay = $('overlay'), octx = overlay.getContext('2d');

  /* ==========================================================================
     DOCUMENT
     ========================================================================== */
  var doc = { w: 0, h: 0, layers: [], active: 0 };
  var loaded = false;
  var nextId = 1;
  var zoom = 1, panX = 0, panY = 0;
  var sel = null;                 // {x,y,w,h} in image pixels, or null for "all"
  var clipboard = null;

  var DEFAULT_ADJ = {
    exposure: 0, contrast: 0, saturation: 0, vibrance: 0,
    temperature: 0, tint: 0, highlights: 0, shadows: 0,
    gamma: 100, hue: 0, sepia: 0, grayscale: 0, invert: 0
  };

  function makeCanvas(w, h) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }

  function newLayer(name, w, h) {
    return {
      id: nextId++, name: name || ('Layer ' + nextId),
      canvas: makeCanvas(w || doc.w, h || doc.h),
      visible: true, opacity: 1, blend: 'source-over', locked: false,
      adj: Object.assign({}, DEFAULT_ADJ),
      cache: null, dirty: true
    };
  }

  function active() { return doc.layers[doc.active] || null; }
  function ctxOf(l) { return l.canvas.getContext('2d', { willReadFrequently: true }); }

  /* ==========================================================================
     ADJUSTMENTS — one pixel pass, shared by preview and export
     ==========================================================================
     Order matters and is fixed: exposure, then white balance, then tone, then
     colour. Reordering these changes the result, so it is not left to whichever
     slider was touched last.
     ========================================================================== */
  function isNeutral(a) {
    for (var k in DEFAULT_ADJ) if (a[k] !== DEFAULT_ADJ[k]) return false;
    return true;
  }

  function applyAdjust(img, a) {
    var d = img.data, n = d.length;
    var expo = Math.pow(2, a.exposure / 100);
    var con = (a.contrast + 100) / 100;
    var gam = 100 / Math.max(1, a.gamma);
    var temp = a.temperature / 100, tint = a.tint / 100;
    var hi = a.highlights / 100, sh = a.shadows / 100;
    var sat = (a.saturation + 100) / 100, vib = a.vibrance / 100;
    var hue = a.hue * Math.PI / 180, cosH = Math.cos(hue), sinH = Math.sin(hue);
    var sep = a.sepia / 100, gray = a.grayscale / 100, inv = a.invert / 100;

    for (var i = 0; i < n; i += 4) {
      if (d[i + 3] === 0) continue;                 // fully transparent: nothing to adjust
      var r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;

      /* exposure, in stops */
      if (a.exposure) { r *= expo; g *= expo; b *= expo; }

      /* white balance: temperature pushes red against blue, tint green against
         magenta — the same two axes a camera exposes */
      if (temp) { r += temp * 0.22; b -= temp * 0.22; }
      if (tint) { g += tint * 0.18; r -= tint * 0.06; b -= tint * 0.06; }

      /* contrast around mid grey */
      if (a.contrast) { r = (r - .5) * con + .5; g = (g - .5) * con + .5; b = (b - .5) * con + .5; }

      /* highlights and shadows, weighted by where the pixel already sits, so
         lifting shadows does not flatten the whole frame */
      if (hi || sh) {
        var lum = r * .2126 + g * .7152 + b * .0722;
        if (hi) { var wH = lum * lum; r += hi * wH; g += hi * wH; b += hi * wH; }
        if (sh) { var wS = (1 - lum) * (1 - lum); r += sh * wS; g += sh * wS; b += sh * wS; }
      }

      if (a.gamma !== 100) {
        r = Math.pow(Math.max(0, r), gam); g = Math.pow(Math.max(0, g), gam); b = Math.pow(Math.max(0, b), gam);
      }

      /* saturation and vibrance. Vibrance protects already-saturated pixels,
         which is what keeps skin from going orange when the slider moves. */
      if (a.saturation || vib) {
        var l2 = r * .2126 + g * .7152 + b * .0722;
        var s = sat;
        if (vib) {
          var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
          s += vib * (1 - (mx - mn));
        }
        r = l2 + (r - l2) * s; g = l2 + (g - l2) * s; b = l2 + (b - l2) * s;
      }

      if (a.hue) {
        /* rotation in YIQ space — cheap and close enough to the CSS filter it
           replaces, so old presets still look like themselves */
        var yy = .299 * r + .587 * g + .114 * b;
        var ii = .596 * r - .274 * g - .322 * b;
        var qq = .211 * r - .523 * g + .312 * b;
        var i2 = ii * cosH - qq * sinH, q2 = ii * sinH + qq * cosH;
        r = yy + .956 * i2 + .621 * q2;
        g = yy - .272 * i2 - .647 * q2;
        b = yy - 1.106 * i2 + 1.703 * q2;
      }

      if (gray) {
        var lg = r * .2126 + g * .7152 + b * .0722;
        r += (lg - r) * gray; g += (lg - g) * gray; b += (lg - b) * gray;
      }
      if (sep) {
        var sr = r * .393 + g * .769 + b * .189;
        var sg = r * .349 + g * .686 + b * .168;
        var sb = r * .272 + g * .534 + b * .131;
        r += (sr - r) * sep; g += (sg - g) * sep; b += (sb - b) * sep;
      }
      if (inv) { r += (1 - r - r) * inv; g += (1 - g - g) * inv; b += (1 - b - b) * inv; }

      d[i] = r < 0 ? 0 : r > 1 ? 255 : r * 255;
      d[i + 1] = g < 0 ? 0 : g > 1 ? 255 : g * 255;
      d[i + 2] = b < 0 ? 0 : b > 1 ? 255 : b * 255;
    }
    return img;
  }

  /* The cached, adjusted version of a layer. Rebuilt only when marked dirty. */
  function layerSurface(l) {
    if (!l.dirty && l.cache) return l.cache;
    if (isNeutral(l.adj)) { l.cache = l.canvas; l.dirty = false; return l.cache; }
    var c = makeCanvas(l.canvas.width, l.canvas.height);
    var cx = c.getContext('2d');
    cx.drawImage(l.canvas, 0, 0);
    var img = cx.getImageData(0, 0, c.width, c.height);
    cx.putImageData(applyAdjust(img, l.adj), 0, 0);
    l.cache = c; l.dirty = false;
    return c;
  }
  function touch(l) { l.dirty = true; l.cache = null; }

  /* ==========================================================================
     COMPOSITE
     ========================================================================== */
  var flat = makeCanvas(1, 1), fctx = flat.getContext('2d', { willReadFrequently: true });

  function composite() {
    if (flat.width !== doc.w || flat.height !== doc.h) { flat.width = doc.w; flat.height = doc.h; }
    fctx.clearRect(0, 0, doc.w, doc.h);
    for (var i = 0; i < doc.layers.length; i++) {
      var l = doc.layers[i];
      if (!l.visible || l.opacity <= 0) continue;
      fctx.globalAlpha = l.opacity;
      fctx.globalCompositeOperation = l.blend;
      fctx.drawImage(layerSurface(l), 0, 0);
    }
    fctx.globalAlpha = 1;
    fctx.globalCompositeOperation = 'source-over';
    return flat;
  }

  function render() {
    if (!loaded) return;
    var w = Math.max(1, Math.round(doc.w * zoom)), h = Math.max(1, Math.round(doc.h * zoom));
    if (view.width !== w || view.height !== h) {
      view.width = w; view.height = h;
      overlay.width = w; overlay.height = h;
    }
    vctx.clearRect(0, 0, w, h);
    vctx.imageSmoothingEnabled = zoom < 3;      // keep pixels crisp when zoomed way in
    vctx.drawImage(composite(), 0, 0, w, h);
    drawOverlay();
    paintHistogram();
    paintLayers();
  }

  function drawOverlay() {
    octx.clearRect(0, 0, overlay.width, overlay.height);
    if (sel) {
      octx.save();
      octx.strokeStyle = '#00F0FF'; octx.lineWidth = 1; octx.setLineDash([5, 4]);
      octx.strokeRect(sel.x * zoom + .5, sel.y * zoom + .5, sel.w * zoom, sel.h * zoom);
      octx.restore();
    }
    if (tool === 'crop' && cropBox) {
      octx.save();
      octx.fillStyle = 'rgba(0,0,0,.5)';
      octx.fillRect(0, 0, overlay.width, overlay.height);
      octx.clearRect(cropBox.x * zoom, cropBox.y * zoom, cropBox.w * zoom, cropBox.h * zoom);
      octx.strokeStyle = '#B6FF3C'; octx.lineWidth = 1.5;
      octx.strokeRect(cropBox.x * zoom + .5, cropBox.y * zoom + .5, cropBox.w * zoom, cropBox.h * zoom);
      /* thirds, because a crop box without them is guesswork */
      octx.strokeStyle = 'rgba(255,255,255,.35)'; octx.lineWidth = 1;
      for (var i = 1; i < 3; i++) {
        var gx = (cropBox.x + cropBox.w * i / 3) * zoom, gy = (cropBox.y + cropBox.h * i / 3) * zoom;
        octx.beginPath(); octx.moveTo(gx, cropBox.y * zoom); octx.lineTo(gx, (cropBox.y + cropBox.h) * zoom); octx.stroke();
        octx.beginPath(); octx.moveTo(cropBox.x * zoom, gy); octx.lineTo((cropBox.x + cropBox.w) * zoom, gy); octx.stroke();
      }
      octx.restore();
    }
    if (shapePreview) {
      octx.save();
      octx.strokeStyle = shapeOpt.stroke; octx.lineWidth = Math.max(1, shapeOpt.width * zoom);
      octx.setLineDash([4, 3]);
      var s = shapePreview;
      if (shapeOpt.kind === 'ellipse') {
        octx.beginPath();
        octx.ellipse((s.x + s.w / 2) * zoom, (s.y + s.h / 2) * zoom,
          Math.abs(s.w / 2) * zoom, Math.abs(s.h / 2) * zoom, 0, 0, Math.PI * 2);
        octx.stroke();
      } else if (shapeOpt.kind === 'line') {
        octx.beginPath(); octx.moveTo(s.x * zoom, s.y * zoom);
        octx.lineTo((s.x + s.w) * zoom, (s.y + s.h) * zoom); octx.stroke();
      } else {
        octx.strokeRect(s.x * zoom, s.y * zoom, s.w * zoom, s.h * zoom);
      }
      octx.restore();
    }
  }

  /* ==========================================================================
     HISTORY
     ==========================================================================
     A snapshot is every layer's pixels plus the structure around them. That is
     memory-hungry, so the stack is short and deliberate: twenty steps on a
     12-megapixel document is roughly a gigabyte if every layer is full size,
     which is why layers share the document's dimensions and the cap is low.
     ========================================================================== */
  var undoStack = [], redoStack = [], MAX_UNDO = 20;

  function snapshot() {
    return {
      w: doc.w, h: doc.h, active: doc.active, sel: sel ? Object.assign({}, sel) : null,
      layers: doc.layers.map(function (l) {

  function rotate(deg) {
    push();
    var swap = deg % 180 !== 0;
    var nw = swap ? doc.h : doc.w, nh = swap ? doc.w : doc.h;
    doc.layers.forEach(function (l) {
      var c = makeCanvas(nw, nh), cx = c.getContext('2d');
      cx.translate(nw / 2, nh / 2);
      cx.rotate(deg * Math.PI / 180);
      cx.drawImage(l.canvas, -doc.w / 2, -doc.h / 2);
      l.canvas = c; touch(l);
    });
    doc.w = nw; doc.h = nh;
    sel = null; fitZoom(); render(); syncBar();
  }

  function flip(axis) {
    push();
    doc.layers.forEach(function (l) {
      var c = makeCanvas(doc.w, doc.h), cx = c.getContext('2d');
      cx.translate(axis === 'x' ? doc.w : 0, axis === 'y' ? doc.h : 0);
      cx.scale(axis === 'x' ? -1 : 1, axis === 'y' ? -1 : 1);
      cx.drawImage(l.canvas, 0, 0);
      l.canvas = c; touch(l);
    });
    render();
  }

  function applyCrop() {
    if (!cropBox || cropBox.w < 4 || cropBox.h < 4) { toast('Drag a crop box first'); return; }
    push();
    var b = cropBox;
    doc.layers.forEach(function (l) {
      var c = makeCanvas(b.w, b.h);
      c.getContext('2d').drawImage(l.canvas, -b.x, -b.y);
      l.canvas = c; touch(l);
    });
    doc.w = b.w; doc.h = b.h;
    cropBox = null; sel = null;
    fitZoom(); render(); paintDock(); syncBar();
  }

  function resizeDoc(w, h) {
    if (!(w > 0 && h > 0)) return;
    push();
    doc.layers.forEach(function (l) {
      var c = makeCanvas(w, h);
      c.getContext('2d').drawImage(l.canvas, 0, 0, w, h);
      l.canvas = c; touch(l);
    });
    doc.w = w; doc.h = h; sel = null;
    fitZoom(); render(); syncBar();
  }

  /* ==========================================================================
     LAYER OPERATIONS
     ========================================================================== */
  function addLayer() {
    push();
    doc.layers.push(newLayer('Layer ' + (doc.layers.length + 1)));
    doc.active = doc.layers.length - 1;
    render(); paintDock();
  }
  function duplicateLayer() {
    var l = active(); if (!l) return;
    push();
    var c = newLayer(l.name + ' copy');
    c.canvas.getContext('2d').drawImage(l.canvas, 0, 0);
    c.opacity = l.opacity; c.blend = l.blend; c.adj = Object.assign({}, l.adj);
    doc.layers.splice(doc.active + 1, 0, c);
    doc.active++;
    render(); paintDock();
  }
  function deleteLayer() {
    if (doc.layers.length <= 1) { toast('A document needs one layer'); return; }
    push();
    doc.layers.splice(doc.active, 1);
    doc.active = Math.max(0, doc.active - 1);
    render(); paintDock();
  }
  function moveLayer(dir) {
    var i = doc.active, j = i + dir;
    if (j < 0 || j >= doc.layers.length) return;
    push();
    var t = doc.layers[i]; doc.layers[i] = doc.layers[j]; doc.layers[j] = t;
    doc.active = j;
    render(); paintDock();
  }
  function mergeDown() {
    if (doc.active === 0) { toast('Nothing below to merge into'); return; }
    push();
    var top = doc.layers[doc.active], bot = doc.layers[doc.active - 1];
    var cx = ctxOf(bot);
    cx.save();
    cx.globalAlpha = top.opacity;
    cx.globalCompositeOperation = top.blend;
    cx.drawImage(layerSurface(top), 0, 0);
    cx.restore();
    touch(bot);
    doc.layers.splice(doc.active, 1);
    doc.active--;
    render(); paintDock();
  }
  function flatten() {
    push();
    var out = newLayer('Flattened');
    out.canvas.getContext('2d').drawImage(composite(), 0, 0);
    doc.layers = [out]; doc.active = 0;
    render(); paintDock();
  }
  /* Bake the sliders into the pixels, so the layer can be filtered or exported
     without carrying its adjustment state around. */
  function bakeAdjust() {
    var l = active(); if (!l || isNeutral(l.adj)) return;
    push();
    var s = layerSurface(l);
    var cx = ctxOf(l);
    cx.clearRect(0, 0, doc.w, doc.h);
    cx.drawImage(s, 0, 0);
    l.adj = Object.assign({}, DEFAULT_ADJ);
    touch(l); render(); paintDock();
  }

  /* ==========================================================================
     HISTOGRAM
     ========================================================================== */
  function paintHistogram() {
    var c = $('hist'); if (!c) return;
    var cx = c.getContext('2d');
    var w = c.width = c.clientWidth || 240, h = c.height = 64;
    cx.clearRect(0, 0, w, h);

    /* Sampled, not exhaustive. Reading twelve million pixels on every slider
       move is what makes an editor feel broken; every 7th pixel gives the same
       shape for a 64px-tall drawing. */
    var img = composite().getContext('2d').getImageData(0, 0, doc.w, doc.h).data;
    var R = new Uint32Array(256), G = new Uint32Array(256), B = new Uint32Array(256);
    for (var i = 0; i < img.length; i += 28) { R[img[i]]++; G[img[i + 1]]++; B[img[i + 2]]++; }
    var max = 1;
    for (i = 1; i < 255; i++) { max = Math.max(max, R[i], G[i], B[i]); }

    var chans = [[R, 'rgba(255,80,120,.75)'], [G, 'rgba(120,255,140,.7)'], [B, 'rgba(90,160,255,.7)']];
    cx.globalCompositeOperation = 'lighter';
    chans.forEach(function (ch) {
      cx.fillStyle = ch[1];
      cx.beginPath(); cx.moveTo(0, h);
      for (var x = 0; x < 256; x++) cx.lineTo(x / 255 * w, h - Math.min(1, ch[0][x] / max) * h);
      cx.lineTo(w, h); cx.closePath(); cx.fill();
    });
    cx.globalCompositeOperation = 'source-over';
  }

  /* ==========================================================================
     EXPORT
     ========================================================================== */
  $('save').addEventListener('click', function () {
    var fmt = $('fmt').value;
    var mime = fmt === 'jpeg' ? 'image/jpeg' : fmt === 'webp' ? 'image/webp' : 'image/png';
    var src = composite();
    var out = src;
    if (fmt === 'jpeg') {
      /* JPEG has no alpha. Without this, transparent areas encode as black and
         the file looks nothing like the canvas. */
      out = makeCanvas(doc.w, doc.h);
      var cx = out.getContext('2d');
      cx.fillStyle = '#FFFFFF'; cx.fillRect(0, 0, doc.w, doc.h);
      cx.drawImage(src, 0, 0);
    }
    out.toBlob(function (b) {
      if (!b) { alert('The browser refused to encode ' + fmt.toUpperCase() + '.'); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'novaclip-photo.' + (fmt === 'jpeg' ? 'jpg' : fmt);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      toast('Exported ' + Math.round(b.size / 1024) + ' KB');
    }, mime, fmt === 'png' ? undefined : 0.92);
  });

  /* ==========================================================================

     ========================================================================== */
  var PRESETS = {

    'Punch':   { contrast: 22, saturation: 26, shadows: -6 },
    'Faded':   { contrast: -16, saturation: -20, shadows: 14, exposure: 6 },
    'Mono':    { grayscale: 100, contrast: 14 },
    'Sepia':   { sepia: 74, saturation: 8, temperature: 12 },
    'Cold':    { temperature: -34, tint: -8, saturation: 12 },
    'Warm':    { temperature: 32, tint: 6, saturation: 10 },
    'Film':    { contrast: 12, saturation: -12, shadows: 12, highlights: -14, gamma: 108 },
    'Noir':    { grayscale: 100, contrast: 38, shadows: -18 },
    'Bleach':  { saturation: -46, contrast: 30, exposure: 8 }
  };

  var SLIDERS = [
    ['exposure', 'Exposure', -100, 100, 1, ''],
    ['contrast', 'Contrast', -100, 100, 1, ''],
    ['highlights', 'Highlights', -100, 100, 1, ''],
    ['shadows', 'Shadows', -100, 100, 1, ''],
    ['saturation', 'Saturation', -100, 100, 1, ''],
    ['vibrance', 'Vibrance', -100, 100, 1, ''],
    ['temperature', 'Temperature', -100, 100, 1, ''],
    ['tint', 'Tint', -100, 100, 1, ''],
    ['gamma', 'Gamma', 20, 250, 1, ''],
    ['hue', 'Hue', -180, 180, 1, '°'],
    ['grayscale', 'Grayscale', 0, 100, 1, '%'],
    ['sepia', 'Sepia', 0, 100, 1, '%']
  ];

  var BLENDS = ['source-over', 'multiply', 'screen', 'overlay', 'darken', 'lighten',
    'color-dodge', 'color-burn', 'hard-light', 'soft-light', 'difference',
    'exclusion', 'hue', 'saturation', 'color', 'luminosity'];
  var BLEND_LABEL = { 'source-over': 'Normal' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function paintLayers() {
    var box = $('layerList'); if (!box) return;
    /* top of the list is the top of the stack, which is how every editor shows
       it and the opposite of the array order */
    box.innerHTML = doc.layers.slice().reverse().map(function (l) {
      var i = doc.layers.indexOf(l);
      return '<div class="layer' + (i === doc.active ? ' on' : '') + '" data-i="' + i + '">' +
        '<button class="eye' + (l.visible ? ' vis' : '') + '" data-eye="' + i + '" type="button" ' +
        'title="Show or hide"><svg viewBox="0 0 24 24">' +
        (l.visible ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>'
                   : '<path d="M17.9 17.9A10.7 10.7 0 0112 20C5 20 1 12 1 12a19 19 0 015.1-5.9M9.9 4.2A10.9 10.9 0 0112 4c7 0 11 8 11 8a19 19 0 01-2.2 3.2M1 1l22 22"/>') +
        '</svg></button>' +
        '<span class="thumb" data-thumb="' + i + '"></span>' +
        '<span class="meta"><b>' + esc(l.name) + '</b><span>' +
        Math.round(l.opacity * 100) + '% · ' + (BLEND_LABEL[l.blend] || l.blend) +
        (isNeutral(l.adj) ? '' : ' · adjusted') + '</span></span>' +
        '</div>';
    }).join('');

    box.querySelectorAll('.layer').forEach(function (el) {
      el.onclick = function (e) {
        if (e.target.closest('[data-eye]')) return;
        doc.active = +el.dataset.i; paintDock(); render();
      };
    });
    box.querySelectorAll('[data-eye]').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var l = doc.layers[+b.dataset.eye];
        l.visible = !l.visible; render();
      };
    });
    /* thumbnails: drawn small, and only when the list is repainted */
    box.querySelectorAll('[data-thumb]').forEach(function (el) {
      var l = doc.layers[+el.dataset.thumb];
      var t = makeCanvas(34, 34);
      var s = Math.min(34 / doc.w, 34 / doc.h);
      var tc = t.getContext('2d');
      tc.drawImage(l.canvas, (34 - doc.w * s) / 2, (34 - doc.h * s) / 2, doc.w * s, doc.h * s);
      el.style.backgroundImage = 'url(' + t.toDataURL() + ')';
    });
  }

  function sliderRow(k, label, min, max, step, unit, v) {
    return '<label class="f">' + label + '</label><div class="row">' +
      '<input type="range" data-adj="' + k + '" min="' + min + '" max="' + max +
      '" step="' + step + '" value="' + v + '">' +
      '<span class="val" data-val="' + k + '">' + v + unit + '</span></div>';
  }

  function paintDock() {
    var d = $('dock');

      d.innerHTML = '<div class="sect"><h3>Nothing open</h3><div class="in">' +

      return;
    }
    var l = active();
    var html = '';

    /* ---- layers ---- */
    html += '<div class="sect"><h3>Layers<span class="sp"></span>' +
      '<button id="lAdd" type="button" title="New layer">+</button>' +
      '<button id="lDup" type="button" title="Duplicate">⧉</button>' +
      '<button id="lDel" type="button" class="danger" title="Delete">✕</button></h3>' +
      '<div class="in"><div id="layerList"></div>' +
      '<div class="grid2" style="margin-top:8px">' +
      '<button id="lUp" type="button">Raise</button>' +

      '<button id="lMerge" type="button">Merge down</button>' +
      '<button id="lFlat" type="button">Flatten</button></div>';

    if (l) {
      html += '<label class="f">Opacity</label><div class="row">' +
        '<input type="range" id="lOpacity" min="0" max="100" value="' + Math.round(l.opacity * 100) + '">' +
        '<span class="val">' + Math.round(l.opacity * 100) + '%</span></div>' +
        '<label class="f">Blend mode</label><select id="lBlend">' +
        BLENDS.map(function (b) {
          return '<option value="' + b + '"' + (b === l.blend ? ' selected' : '') + '>' +

        }).join('') + '</select>' +
        '<label class="f">Name</label><input type="text" id="lName" value="' + esc(l.name) + '">';

    /* ---- histogram ---- */

      html += '<div class="sect"><h3>Adjust<span class="sp"></span>' +

        '<label class="f">Size</label><div class="row"><input type="range" id="bSize" min="1" max="300" value="' + brush.size + '"><span class="val">' + brush.size + '</span></div>' +
        '<label class="f">Opacity</label><div class="row"><input type="range" id="bOpacity" min="5" max="100" value="' + Math.round(brush.opacity * 100) + '"><span class="val">' + Math.round(brush.opacity * 100) + '%</span></div>';
      if (tool === 'brush') {
        html += '<label class="f">Hardness</label><div class="row"><input type="range" id="bHard" min="0" max="100" value="' + Math.round(brush.hardness * 100) + '"><span class="val">' + Math.round(brush.hardness * 100) + '%</span></div>' +
          '<label class="f">Colour</label><input type="color" id="bColor" value="' + brush.color + '">' +

  function wireDock() {
    var l = active();
    var on = function (id, ev, fn) { var el = $(id); if (el) el[ev] = fn; };

    on('lAdd', 'onclick', addLayer);
    on('lDup', 'onclick', duplicateLayer);
    on('lDel', 'onclick', deleteLayer);
    on('lUp', 'onclick', function () { moveLayer(1); });
    on('lDown', 'onclick', function () { moveLayer(-1); });
    on('lMerge', 'onclick', mergeDown);
    on('lFlat', 'onclick', flatten);

    on('lOpacity', 'oninput', function () {
      l.opacity = this.value / 100;
      this.nextElementSibling.textContent = this.value + '%';
      render();
    });
    on('lOpacity', 'onchange', push);
    on('lBlend', 'onchange', function () { push(); l.blend = this.value; render(); paintLayers(); });
    on('lName', 'onchange', function () { l.name = this.value.slice(0, 40) || l.name; paintLayers(); });

    /* adjustments: live while dragging, one history entry when released */
    $('dock').querySelectorAll('[data-adj]').forEach(function (r) {
      r.oninput = function () {
        l.adj[r.dataset.adj] = +r.value;
        var v = $('dock').querySelector('[data-val="' + r.dataset.adj + '"]');
        if (v) v.textContent = r.value;
        touch(l); render();
      };
      r.onchange = push;
    });
    on('aReset', 'onclick', function () {
      push(); l.adj = Object.assign({}, DEFAULT_ADJ); touch(l); render(); paintDock();
    });
    on('aBake', 'onclick', bakeAdjust);
    $('dock').querySelectorAll('[data-preset]').forEach(function (b) {
      b.onclick = function () {
        push();
        l.adj = Object.assign({}, DEFAULT_ADJ, PRESETS[b.dataset.preset]);
        touch(l); render(); paintDock();
      };
    });

    on('bSize', 'oninput', function () { brush.size = +this.value; this.nextElementSibling.textContent = this.value; });
    on('bOpacity', 'oninput', function () { brush.opacity = this.value / 100; this.nextElementSibling.textContent = this.value + '%'; });
    on('bHard', 'oninput', function () { brush.hardness = this.value / 100; this.nextElementSibling.textContent = this.value + '%'; });
    on('bColor', 'oninput', function () { brush.color = this.value; });
    if ($('bSwatch')) {
      $('bSwatch').innerHTML = ['#FF2E97', '#00F0FF', '#B6FF3C', '#FFB443', '#FFFFFF', '#000000', '#7209B7']
        .map(function (c) { return '<i style="background:' + c + '" data-c="' + c + '"></i>'; }).join('');
      $('bSwatch').querySelectorAll('[data-c]').forEach(function (s) {
        s.onclick = function () { brush.color = s.dataset.c; if ($('bColor')) $('bColor').value = s.dataset.c; };
      });
    }

    $('dock').querySelectorAll('[data-shape]').forEach(function (b) {
      b.onclick = function () { shapeOpt.kind = b.dataset.shape; paintDock(); };
    });
    on('sWidth', 'oninput', function () { shapeOpt.width = +this.value; this.nextElementSibling.textContent = this.value; });
    on('sStroke', 'oninput', function () { shapeOpt.stroke = this.value; });
    on('sFill', 'oninput', function () { shapeOpt.fill = this.value; });
    on('sFilled', 'onchange', function () { shapeOpt.filled = this.checked; });
    on('fTol', 'oninput', function () { fillTolerance = +this.value; this.nextElementSibling.textContent = this.value; });

    on('tVal', 'oninput', function () { textOpt.value = this.value; });
    on('tSize', 'oninput', function () { textOpt.size = +this.value; this.nextElementSibling.textContent = this.value; });
    on('tWeight', 'onchange', function () { textOpt.weight = this.value; });
    on('tFont', 'onchange', function () { textOpt.font = this.value; });
    on('tColor', 'oninput', function () { textOpt.color = this.value; });
    on('tStroke', 'oninput', function () { textOpt.stroke = this.value; });
    on('tSW', 'oninput', function () { textOpt.strokeWidth = +this.value; this.nextElementSibling.textContent = this.value; });

    on('cApply', 'onclick', applyCrop);

    on('selAll', 'onclick', function () { sel = { x: 0, y: 0, w: doc.w, h: doc.h }; drawOverlay(); paintDock(); });
    on('selNone', 'onclick', function () { sel = null; drawOverlay(); paintDock(); });
    on('selCut', 'onclick', function () {
      if (!sel || !l) return;
      push(); ctxOf(l).clearRect(sel.x, sel.y, sel.w, sel.h); touch(l); render();
    });
    on('selLayer', 'onclick', function () {
      if (!sel || !l) return;
      push();
      var nl = newLayer('Selection');
      nl.canvas.getContext('2d').drawImage(l.canvas, sel.x, sel.y, sel.w, sel.h, sel.x, sel.y, sel.w, sel.h);
      doc.layers.splice(doc.active + 1, 0, nl);
      doc.active++;
      render(); paintDock();
    });

    $('dock').querySelectorAll('[data-filter]').forEach(function (b) {
      b.onclick = function () {
        push();
        var name = b.dataset.filter;
        try { FILTERS[name](); } catch (e) { toast('That filter failed on this image'); }
        render(); paintDock();
      };
    });

    on('rotL', 'onclick', function () { rotate(-90); });
    on('rotR', 'onclick', function () { rotate(90); });
    on('flipH', 'onclick', function () { push(); flip('x'); });
    on('flipV', 'onclick', function () { push(); flip('y'); });
    on('rGo', 'onclick', function () { resizeDoc(+$('rw').value | 0, +$('rh').value | 0); paintDock(); });
  }

  /* ==========================================================================
     ZOOM, KEYS, TOASTS
     ========================================================================== */
  $('stage').addEventListener('wheel', function (e) {
    if (!loaded) return;
    e.preventDefault();
    zoom = Math.min(8, Math.max(.05, zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    render(); syncBar();
  }, { passive: false });

  var spaceHeld = false, prevTool = null;
  addEventListener('keydown', function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''));
    if (e.code === 'Space' && !typing && !spaceHeld) {
      spaceHeld = true; prevTool = tool; setTool('pan'); e.preventDefault(); return;
    }
    if (typing) return;
    var mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (e.key === 'Escape') { sel = null; cropBox = null; drawOverlay(); paintDock(); return; }
    if (e.key === '[') { brush.size = Math.max(1, brush.size - 4); paintDock(); return; }
    if (e.key === ']') { brush.size = Math.min(300, brush.size + 4); paintDock(); return; }
    var keys = { b: 'brush', e: 'eraser', m: 'select', v: 'move', t: 'text', c: 'crop',
      g: 'fill', s: 'shape', i: 'pick', a: 'adjust', l: 'clone' };
    if (!mod && keys[e.key.toLowerCase()]) setTool(keys[e.key.toLowerCase()]);
  });
  addEventListener('keyup', function (e) {
    if (e.code === 'Space' && spaceHeld) { spaceHeld = false; if (prevTool) setTool(prevTool); }
  });

  var toastEl = null;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);' +
        'background:#0C1220;border:1px solid rgba(255,255,255,.16);color:#EAF2FF;padding:9px 16px;' +
        'border-radius:24px;font-size:.85rem;font-weight:600;z-index:9999;pointer-events:none;' +
        'transition:opacity .25s';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.style.opacity = '0'; }, 1600);
  }

  $('undo').addEventListener('click', undo);
  $('redo').addEventListener('click', redo);
  addEventListener('resize', function () { if (loaded) fitZoom(); });

  paintRail(); paintDock(); syncBar();
})();
</script>
</body>
</html>
