<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>NovaClip — Creator Pipeline</title>
<meta name='description' content='Idea to publish in one guided pipeline. NovaClip walks you through trend, idea, script, footage, AI analysis, AutoDirector, thumbnail, title and SEO — and recommends the next move.'>
<meta name='theme-color' content='#05060A'>
<meta name='author' content='NovaClip'>
<link rel='icon' href='logo.svg'>
<style>
:root{ --void:#05060A; --void2:#0A0C14; --cyan:#00F0FF; --magenta:#FF2E97; --lime:#B6FF3C; --white:#EAF2FF; --dim:#7E8AA6; --line:rgba(120,140,200,0.14); }
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--white);font-family:'Segoe UI',-apple-system,sans-serif;overflow-x:hidden;line-height:1.5}
::selection{background:var(--magenta);color:#fff}
a{color:inherit;text-decoration:none}

.wrap{max-width:1080px;margin:0 auto;padding:42px 24px 110px}

.page-head{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.page-head h1{font-size:clamp(26px,3vw,40px);font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--white),var(--cyan));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;width:max-content}
.page-head p{color:var(--dim);font-size:15px;max-width:680px}
.head-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--lime);
  border:1px solid rgba(182,255,60,.35);border-radius:999px;padding:3px 10px;background:rgba(182,255,60,.06)}
.badge.dim{color:var(--dim);border-color:var(--line);background:transparent}

/* ===== pipeline ===== */
#ncpipe{display:flex;flex-direction:column;gap:18px}

.pl-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.pl-title h1{font-size:clamp(22px,2.6vw,32px);font-weight:800;letter-spacing:-.4px}
.pl-sub{color:var(--dim);font-size:13.5px;margin-top:2px;max-width:720px}
.pl-pick{display:flex;gap:8px;align-items:center}
.pl-pick select{background:var(--void2);border:1px solid var(--line);color:var(--white);
  border-radius:10px;padding:9px 12px;font:600 13.5px 'Segoe UI',sans-serif;outline:0;min-width:190px}
.pl-btn{background:linear-gradient(135deg,var(--cyan),#7C5CFF);border:0;color:#05060A;font-weight:800;
  border-radius:10px;padding:9px 15px;cursor:pointer;font:800 13px 'Segoe UI',sans-serif;transition:transform .15s,filter .15s;white-space:nowrap}
.pl-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.pl-btn:disabled{opacity:.55;cursor:wait;transform:none}
.pl-mini{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--white);
  border-radius:8px;padding:6px 11px;font:600 12px 'Segoe UI',sans-serif;cursor:pointer}
.pl-mini:hover{border-color:rgba(0,240,255,.5)}

.pl-rail{display:flex;gap:6px;flex-wrap:wrap;background:linear-gradient(160deg,rgba(14,17,28,.85),rgba(8,10,16,.9));
  border:1px solid var(--line);border-radius:16px;padding:10px}
.pl-stage{flex:1;min-width:74px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 6px;
  border-radius:11px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);opacity:.62;transition:.18s;cursor:pointer}
.pl-stage:hover{opacity:1;border-color:rgba(0,240,255,.45);transform:translateY(-1px)}
.pl-stage.done{opacity:1;border-color:rgba(182,255,60,.35);background:rgba(182,255,60,.05)}
.pl-stage.done .pl-ico{filter:none}
.pl-stage.now{opacity:1;border-color:rgba(0,240,255,.6);background:rgba(0,240,255,.07);box-shadow:inset 0 0 0 1px rgba(0,240,255,.25)}
.pl-ico{font-size:17px;line-height:1;filter:grayscale(.4)}
.pl-lab{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);text-align:center}

.pl-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pl-card{background:linear-gradient(160deg,rgba(14,17,28,.9),rgba(8,10,16,.9));
  border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.pl-cardh{font-size:11.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--dim)}
.pl-move{display:flex;gap:12px;align-items:flex-start}
.pl-move .pl-ico{font-size:22px;filter:none;flex:none}
.pl-move b{font-size:14px;display:block}
.pl-move p{color:var(--dim);font-size:12.5px;margin-top:2px}
.pl-move .pl-btn{margin-left:auto;flex:none}

.pl-progbar{height:8px;border-radius:999px;background:rgba(120,140,200,.14);overflow:hidden}
.pl-progbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--magenta));transition:width .25s}
.pl-progbar.pl-big{height:10px}
.pl-progt{font-size:12px;color:var(--dim);margin-top:6px}
.pl-meta{display:flex;gap:8px;flex-wrap:wrap}
.pl-meta span{font-size:11.5px;font-weight:700;color:var(--white);background:rgba(0,240,255,.08);
  border:1px solid rgba(0,240,255,.22);border-radius:999px;padding:4px 10px}
.pl-dna{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.pl-dna span{font-size:10.5px;font-weight:700;color:var(--dim);background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px 9px}

.pl-panel{display:flex;flex-direction:column;gap:14px}
.pl-stagecard{display:flex;flex-direction:column;gap:13px;padding:20px}

.pl-demo{color:var(--magenta);font-size:11.5px;font-style:italic}
.pl-trend{display:flex;align-items:center;gap:12px;border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:11px 13px;transition:.15s}
.pl-trend:hover{border-color:rgba(0,240,255,.4)}
.pl-trend .pl-tn{flex:1;min-width:0}
.pl-trend b{font-size:14px;display:block}
.pl-trend span{color:var(--dim);font-size:12px}
.pl-trend .pl-btn{flex:none}

.pl-out{display:flex;flex-direction:column;gap:10px}
.pl-idea{font-size:18px;font-weight:800;background:linear-gradient(90deg,var(--white),var(--cyan));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pl-script{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:14px}
.pl-script b{font-size:11px;letter-spacing:1px;color:var(--cyan);text-transform:uppercase}
.pl-script div{color:#E7EEFF;font-size:14px;line-height:1.55}

.pl-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pl-form label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.pl-form select{background:var(--void2);border:1px solid var(--line);color:var(--white);
  border-radius:9px;padding:8px 10px;font:600 13px 'Segoe UI',sans-serif;outline:0}

.pl-state{color:var(--dim);font-size:13px}
.pl-note{color:var(--dim);font-size:12.5px}
.pl-note b{color:var(--white)}

.pl-clips{display:flex;flex-direction:column;gap:9px}
.pl-clip{display:flex;gap:12px;align-items:flex-start;border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:11px 13px}
.pl-rank{background:linear-gradient(135deg,var(--magenta),#7C5CFF);color:#fff;font-weight:800;
  border-radius:9px;width:27px;height:27px;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.pl-cb{flex:1;min-width:0}
.pl-ct{font-weight:800;font-size:13.5px;color:var(--cyan)}
.pl-cr{color:#D6DEF0;font-size:12.5px;line-height:1.45;margin:2px 0 6px}
.pl-cs{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
.pl-ca{display:flex;flex-direction:column;gap:6px;flex:none}

.pl-short{border:1px solid rgba(182,255,60,.22);background:rgba(182,255,60,.04);
  border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.pl-short b{color:var(--lime)}
.pl-shook{font-weight:700;color:#fff}
.pl-scap{color:#D6DEF0}
.pl-stags{color:var(--dim);font-size:12px}
.pl-splan{color:var(--dim);font-size:11.5px;border-top:1px dashed rgba(255,255,255,.1);padding-top:6px;margin-top:2px}

.pl-thumb{display:flex;gap:13px;align-items:center;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:11px 13px;cursor:pointer;text-align:left;color:var(--white);transition:.15s;font:inherit}
.pl-thumb:hover{border-color:rgba(0,240,255,.45);transform:translateY(-1px)}
.pl-timg{font-size:24px;flex:none}
.pl-thumb b{font-size:14px;display:block}
.pl-thumb span{color:var(--dim);font-size:12px}

.pl-seo{border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:11px 13px}
.pl-seo b{display:block;font-size:10.5px;letter-spacing:.8px;color:var(--magenta);text-transform:uppercase;margin-bottom:3px}
.pl-seo div{font-size:13.5px;color:#E7EEFF}

.pl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.pl-grid p{color:var(--dim);font-size:12.5px}

.pl-dnaed{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:6px}
.pl-dnaed label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.pl-dnaed select{background:var(--void2);border:1px solid var(--line);color:var(--white);
  border-radius:9px;padding:8px 10px;font:600 13px 'Segoe UI',sans-serif;outline:0}

.pl-job{display:flex;align-items:center;gap:9px;font-size:12px;color:#B8C4D8;
  border:1px solid rgba(255,255,255,.07);border-radius:9px;padding:8px 10px}
.pl-job i{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.pl-job.processing i{background:#FFB62E}
.pl-job.completed i{background:var(--lime)}
.pl-job.failed i{background:var(--magenta)}
.pl-job span:first-of-type{font-weight:700;text-transform:capitalize}
.pl-jn{flex:1;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-job em{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}

#plToast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:linear-gradient(135deg,#0E1220,#101828);border:1px solid rgba(0,240,255,.4);color:#EAF2FF;
  padding:12px 18px;border-radius:12px;font:600 13.5px 'Segoe UI',sans-serif;z-index:1000;
  box-shadow:0 14px 40px rgba(0,0,0,.6);transition:.25s;max-width:min(92vw,520px)}
#plToast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .wrap{padding:26px 16px 100px}
  .pl-rail{overflow-x:auto;flex-wrap:nowrap;padding-bottom:8px}
  .pl-stage{min-width:76px}
  .pl-clip{flex-wrap:wrap}
  .pl-ca{flex-direction:row;width:100%}
}
</style>
</head>
<body>

<aside class='sidebar'>
  <div id='ncbrand'></div>
  <nav></nav>
  <div class='themewrap'>
    <div id='ncprofile'></div>
  </div>
</aside>

<main class='main'>
  <div class='wrap'>

    <header class='page-head'>
      <div class='head-row'>
        <h1 data-t='pipeline'>Creator Pipeline</h1>
        <span class='badge' data-t='pipe_demo'>Live locally</span>
      </div>
      <p data-t='pipe_sub'>One project, ten stages, from trend to published — with the next move suggested after every step. Projects and Creator DNA stay in this browser.</p>
    </header>

    <div id='ncpipeHost'></div>

  </div>
</main>

<script src='services/ai/ai-providers.js'></script>
<script src='services/ai/video.js'></script>
<script src='pipeline.js'></script>
<script src='nova.js'></script>
</body>
</html>
