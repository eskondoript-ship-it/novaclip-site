<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NovaClip">
  <!-- ==========================================================================
       THE NOVACLIP MARK
       Two ideas in one shape, because the name is two words:
         NOVA — a four-point burst, points drawn with concave flanks so it reads
                as light rather than as a plus sign.
         CLIP — the negative space at its centre is a play triangle.
       The triangle is CUT OUT of the burst rather than laid on top, so the mark
       survives being one flat colour: at 16px in a browser tab there is no room
       for a second element, and a logo that needs two colours to be legible is a
       logo that disappears in a favicon.

       The first draft had thin, very concave points and a small triangle. It
       looked sharp at 180px and turned into an anonymous sparkle at 32px — the
       triangle was the first thing to go, which is the half that says "video".
       So the body is fatter and the triangle takes a bigger bite: the shape
       that has to survive shrinking is the one that carries the meaning.
       ========================================================================== -->
  <defs>
    <linearGradient id="ncg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#7209B7"/>
      <stop offset="1" stop-color="#FF2E97"/>
    </linearGradient>
    <mask id="ncplay">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M25.4 20.6 L45.8 32 L25.4 43.4 Z" fill="#000"/>
    </mask>
  </defs>

  <path mask="url(#ncplay)" fill="url(#ncg)" d="
    M32 2
    C34.6 17.4 40.2 24.2 54.4 27.4
    L62 32
    L54.4 36.6
    C40.2 39.8 34.6 46.6 32 62
    C29.4 46.6 23.8 39.8 9.6 36.6
    L2 32
    L9.6 27.4
    C23.8 24.2 29.4 17.4 32 2
    Z"/>
</svg>
