<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<!-- PWA. The manifest and the icons sit at the site root so they resolve at
     https://novaclip.org/manifest.json and /icons/..., which is what an install
     prompt and PWABuilder look for. The service worker is registered at the end
     of nova.js, which all 24 pages already load. -->
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>NovaClip — no connection</title>
<meta name='theme-color' content='#05070E' media='(prefers-color-scheme: dark)'>
<meta name='theme-color' content='#F5F7FB' media='(prefers-color-scheme: light)'>
<link rel='icon' href='/logo.svg' type='image/svg+xml'>
<!-- Shown by sw.js when a page is asked for that has never been visited and
     the network is not there. Deliberately self-contained: no stylesheet, no
     script, no font — the one page that has to render when nothing else can
     be fetched cannot depend on anything being fetched. -->
<style>
  /* THE ONE PAGE THAT CANNOT READ THE THEME.

     Every other page learns light or dark from nova.js, which reads the
     visitor's stored choice. This page is served when the network is gone and
     has no script by design, so it cannot know what they picked — it can only
     ask the operating system, through prefers-color-scheme.

     That is not quite the same setting, and it is the closest one available.
     Getting it wrong here used to mean a black rectangle arriving in the
     middle of an otherwise light session, which reads as a crash rather than
     as a message. The values are the site's own tokens, written out because
     there is no stylesheet to read them from. */
  :root{
    --bg:#05070E; --text:#EAF2FF; --dim:#7E8AA6;
    --accent:#00F0FF; --accent-ink:#04121A; --accent-hover:#5CF7FF;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#F5F7FB; --text:#0B0E16; --dim:#59637A;
      /* #00F0FF on white is about 1.3:1, so the button takes the darker
         sibling the rest of the site uses in light mode. */
      --accent:#00778C; --accent-ink:#FFFFFF; --accent-hover:#0A6E86;
    }
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);display:grid;place-items:center;
       padding:24px;text-align:center;
       font:16px/1.6 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  .wrap{max-width:30rem}
  img{width:88px;height:88px;margin:0 auto 20px;display:block}
  h1{font-size:1.75rem;margin:0 0 12px;letter-spacing:-0.01em}
  p{margin:0 0 10px;color:var(--dim)}
  button{margin-top:22px;min-height:44px;padding:12px 26px;border:0;border-radius:999px;
         background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem;cursor:pointer}
  button:hover{background:var(--accent-hover)}
</style>
</head>
<body>
  <div class='wrap'>
    <img src='/logo.svg' alt='' width='88' height='88'>
    <h1>You are offline</h1>
    <p>NovaClip could not reach the network, so this page has not been loaded.</p>
    <p>Pages you have already opened still work. Anything you were working on is
       saved on this device and will be there when you are back.</p>
    <button type='button' onclick='location.reload()'>Try again</button>
  </div>
</body>
</html>
