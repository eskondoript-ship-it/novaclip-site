<script>/* Theme before first paint. nova.js runs at the end of <body>, so a theme
   applied there lands after the page has already been painted dark — a white
   flash on every navigation for anyone using light mode. Six lines here cost
   nothing and remove it. Kept in sync with ncApplyTheme() in nova.js. */
(function(){try{var p=localStorage.getItem('nc_theme')||'system';
var b=localStorage.getItem('nc_skin_bg');
var t=(p==='light'||p==='dark')?p:(b?'dark':(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
var r=document.documentElement;r.setAttribute('data-theme',t);r.setAttribute('data-theme-pref',p);
r.style.colorScheme=t;
/* A cyber skin repaints the palette from nova.js, which runs at the end of
   <body>. Painting its background here, before the first frame, is what stops
   every navigation flashing the default dark first. */
if(b){r.style.background=b;r.setAttribute('data-skin',p);}}catch(e){}})();</script>

<!-- Google Analytics 4 (gtag.js) — measurement ID G-QN1QE08F2K.
     In the head on every page, which is where Google's own snippet goes: it
     loads async so it never blocks a paint, and page_view fires without any
     further wiring.

     THIS IS WHY privacy.html CHANGED IN THE SAME COMMIT. That page said there
     was no analytics on NovaClip. From here that is not true, and a policy
     that quietly drifts from what the software does is a promise being broken
     without telling anybody. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QN1QE08F2K"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  /* CONSENT FIRST, MEASUREMENT SECOND.
     Denied before anything else runs, so no analytics cookie is written and no
     measurement is sent until somebody says yes. In the EU that is the order
     the law asks for, and this audience is 13-18, which raises the bar rather
     than lowering it.

     Google's own snippet does not do this — the default is granted, and the
     tag starts measuring on load. Reversing the default is the whole point:
     "ask afterwards" is not asking.

     nova.js draws the banner and calls gtag('consent','update',...) when the
     answer comes in; a stored yes from a previous visit is applied here so the
     question is asked once rather than on every page. */
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied',
    wait_for_update: 500
  });
  try {
    if (localStorage.getItem('nc_consent') === 'yes') {
      gtag('consent', 'update', { analytics_storage: 'granted' });
    }
  } catch (e) {}

  gtag('js', new Date());
  gtag('config', 'G-QN1QE08F2K');
</script>

     that made the editor look bolted together.

     It is normally opened from the editor's Trends tab, where it runs inside an
     overlay with ?embed=1. Opened on its own it is the same app, full width. */
  html, body { height: 100%; margin: 0; background: #070a13; }

<style>
/* ---------------------------------------------------------------------------
   RESERVE THE RAIL'S WIDTH
   ---------------------------------------------------------------------------
   .nc-sidebar is position:fixed at 248px, and nothing in the bundled stylesheet
   gives the content that width back. .nc-main is `max-width:1240px;margin:0
   auto`, so it centres on the viewport and the first 248px of every heading and
   paragraph disappears behind the rail — measured at 1366, the hero title
   started at x=63 and its first two words were unreadable.

   The rail's own breakpoint is 900px (below that it is display:none and a
   .nc-topbar takes over), so the padding is applied above that and nowhere
   else. Width comes from the page's own --nc-sidebar rather than a repeated
   number, so the two cannot drift apart.
   --------------------------------------------------------------------------- */
@media (min-width: 901px) {
  body.nova .nc-app { padding-left: var(--nc-sidebar, 248px); }
}

<script>
/* ---------------------------------------------------------------------------
   A WAY BACK OUT
   ---------------------------------------------------------------------------
   This page is a bundled app with its own rail, and that rail listed only its
   own routes — Home, Trend Spotter, Video Ideas, Scripts, Thumbnails, Editor,
   Publish, all of them hash routes inside this one file. There was not a single
   link to the rest of novaclip.org anywhere on it. Opening it from the site's
   sidebar meant the browser Back button or nothing.

   The rail is React-rendered, so the link is added afterwards rather than by
   editing the bundle: wait for the nav, add one row at the top styled with the
   page's own .nc-nav-item class so it cannot drift from the others, and stop
   watching. If the app ever re-renders the nav away, the observer puts it
   back.
   --------------------------------------------------------------------------- */
(function () {
  var ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M19 12H5M12 19l-7-7 7-7"/></svg>';

  function add() {
    var navs = document.querySelectorAll('.nc-nav');
    if (!navs.length) return false;
    for (var i = 0; i < navs.length; i++) {
      var nav = navs[i];
      if (nav.querySelector('.nc-backhome')) continue;
      var a = document.createElement('a');
      a.className = 'nc-nav-item nc-backhome';
      a.href = 'index.html';
      a.innerHTML = ICON + '<span>Back to NovaClip</span>';
      a.style.marginBottom = '6px';
      nav.insertBefore(a, nav.firstChild);
    }
    return true;
  }

  /* The drawer on a phone mounts its own copy of the nav later, so this keeps
     watching rather than disconnecting after the first success. */
  add();
  new MutationObserver(add).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
