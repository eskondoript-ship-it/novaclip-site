<!DOCTYPE html>
<html lang='en'>
<head>
<script>/* Theme before first paint. nova.js runs at the end of <body>, so a theme
   applied there lands after the page has already been painted dark — a white
   flash on every navigation for anyone using light mode. Six lines here cost
   nothing and remove it. Kept in sync with ncApplyTheme() in nova.js. */
(function(){try{var p=localStorage.getItem('nc_theme')||'system';
var b=localStorage.getItem('nc_skin_bg');
var t=(p==='light'||p==='dark')?p:(b?'dark':(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
var r=document.documentElement;r.setAttribute('data-theme',t);r.setAttribute('data-theme-pref',p);
r.style.colorScheme=t;
/* A cyber skin repaints the palette from nova.js, which runs at the end of
   <body>. Painting its background here, before the first frame, is what stops
   every navigation flashing the default dark first. */
if(b){r.style.background=b;r.setAttribute('data-skin',p);}}catch(e){}})();</script>
<meta charset='UTF-8'>
<!-- Google Analytics 4 (gtag.js) — measurement ID G-QN1QE08F2K.
     In the head on every page, which is where Google's own snippet goes: it
     loads async so it never blocks a paint, and page_view fires without any
     further wiring.

     THIS IS WHY privacy.html CHANGED IN THE SAME COMMIT. That page said there
     was no analytics on NovaClip. From here that is not true, and a policy
     that quietly drifts from what the software does is a promise being broken
     without telling anybody. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QN1QE08F2K"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  /* CONSENT FIRST, MEASUREMENT SECOND.
     Denied before anything else runs, so no analytics cookie is written and no
     measurement is sent until somebody says yes. In the EU that is the order
     the law asks for, and this audience is 13-18, which raises the bar rather
     than lowering it.

     Google's own snippet does not do this — the default is granted, and the
     tag starts measuring on load. Reversing the default is the whole point:
     "ask afterwards" is not asking.

     nova.js draws the banner and calls gtag('consent','update',...) when the
     answer comes in; a stored yes from a previous visit is applied here so the
     question is asked once rather than on every page. */
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied',
    wait_for_update: 500
  });
  try {
    if (localStorage.getItem('nc_consent') === 'yes') {
      gtag('consent', 'update', { analytics_storage: 'granted' });
    }
  } catch (e) {}

  gtag('js', new Date());
  /* Analytics only, never advertising signals.
     The consent defaults above already deny ad_storage, ad_user_data and
     ad_personalization, so this is belt and braces — but these two flags are
     what a privacy audit actually greps for, and they turn off the paths that
     let a GA4 property feed Google's advertising profiles. This site is read by
     13-18 year olds; profiling them for ads is banned outright by the EU's
     Digital Services Act, and NovaTools' ad units are contextual-only for the
     same reason. */
  gtag('config', 'G-QN1QE08F2K', {
    allow_google_signals: false,
    allow_ad_personalization_signals: false
  });
</script>

/* Two breakpoints, because they answer two different questions.

   820 is where this page's own column stops needing the rail's margin, and
   that is a judgement about this layout — it stays where it was.

   Hiding the rail is not that question. nova.js turns the rail into the
   bottom strip below 761, so hiding it at 820 left the band from 761 to 820
   with the rail switched off and the strip not yet started: on a 768px tablet
   this page had no navigation on it at all, and every one of its fourteen
   links was display:none. The hide has to line up with the width the strip

<style>

<!-- Before the script below, not after it. Everything on this page is drawn
     from NC_CATEGORY — the nine buttons, what is currently chosen, and the
     save — so a categories.js that loads afterwards leaves the block below
     returning on its first line and the page blank and unsaveable. -->
<script src='category-scene.js'></script>
<script src='categories.js'></script>
<script>
/* The list, the key and the read/write all live in categories.js, so this page
   and the first-run dialog can never offer different options. */
(function () {
  var C = window.NC_CATEGORY;
  if (!C) {
    /* Says so rather than showing an empty page: a grid that renders nothing
       looks like a category list with no categories in it. */
    var n = document.getElementById('catNow');
    if (n) n.textContent = 'categories.js did not load, so this page cannot ' +
                           'show or save a category. Reload, and if it stays ' +
                           'this way the file is missing from the server.';
    return;
  }
  var grid = document.getElementById('catGrid');
  var own  = document.getElementById('catOwn');
  var said = document.getElementById('catSaid');
  var now  = document.getElementById('catNow');

  function paintBg() {
    var bg = document.getElementById('catBg');
    if (!bg) return;
    var cur = C.get();
    var preset = C.PRESETS.some(function (p) { return p.id === cur; });
    if (!cur) { bg.textContent = ''; return; }
    if (!preset) {
      bg.textContent = 'Written-in categories use their own colours. Background ' +
                       'photographs are looked up by filename, and there is no ' +
                       'file to look up for one you typed.';
      return;
    }
    var url = (typeof ncCategoryPhotoUrl === 'function') ? ncCategoryPhotoUrl() : '';
    bg.textContent = url
      ? 'Background photo: ' + url + ' — in use.'
      : 'No background photo for this one. Drop an image at backgrounds/' + cur +
        '.jpg (png, jpeg and webp work too) and reload.';
  }
  /* The probe is asynchronous, so the answer can arrive after this page has
     already drawn itself once. */
  addEventListener('nc-cat-photo', paintBg);

  function paint() {
    var cur = C.get();
    now.textContent = cur ? 'Right now: ' + C.labelOf(cur) : 'Not set yet.';
    paintBg();
    [].forEach.call(grid.children, function (b) {
      b.classList.toggle('on', b.getAttribute('data-id') === cur);
    });
    /* A written-in answer belongs back in the box it was written in, so it can
       be edited rather than retyped from scratch. */
    var preset = C.PRESETS.some(function (p) { return p.id === cur; });
    if (cur && !preset && own.value !== cur) own.value = cur;
  }

  C.PRESETS.forEach(function (p) {
    var b = document.createElement('button');
    b.className = 'catopt';
    b.type = 'button';
    b.setAttribute('data-id', p.id);
    b.innerHTML = '<b></b><span></span>';
    b.querySelector('b').textContent = p.label;
    b.querySelector('span').textContent = p.hint;
    b.onclick = function () {
      C.set(p.id); C.markAsked();
      said.textContent = 'Saved — ' + p.label + '.';
      paint();
    };
    grid.appendChild(b);
  });

  document.getElementById('catSave').onclick = function () {
    var v = own.value.trim();
    if (!v) { said.textContent = 'Type something first, or pick one above.'; return; }
    if (C.set(v)) { C.markAsked(); said.textContent = 'Saved — ' + v + '.'; paint(); }
    else { said.textContent = 'This browser is not letting the page save anything.'; }
  };
  own.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('catSave').click();
  });

  paint();
})();
</script>
