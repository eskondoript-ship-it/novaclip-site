<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="NovaTools">
  <!-- The Nova mark: a star explosion. Generated by scratchpad/make-logos.mjs —
       edit that, not this, or the three sites drift apart. -->
  <defs>
    <radialGradient id="novatools-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2867E4" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#2867E4" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#2867E4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="novatools-body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#4C7BF0"/>
      <stop offset="100%" stop-color="#2867E4"/>
    </linearGradient>
    
  </defs>

  <!-- the light it throws -->
  <circle cx="32" cy="32" r="31" fill="url(#novatools-halo)"/>

  <!-- the shockwave, still expanding -->
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#2867E4" stroke-opacity="0.32"
          stroke-width="1.3" stroke-dasharray="7 5.5" stroke-linecap="round"/>

  <!-- what it threw off -->
  <g>
    <circle cx="56.9" cy="42.3" r="1.9" fill="#2867E4" opacity="0.55"/>
    <circle cx="41.4" cy="54.6" r="1.3" fill="#2867E4" opacity="0.35"/>
    <circle cx="21.7" cy="56.9" r="1.9" fill="#2867E4" opacity="0.55"/>
    <circle cx="9.4" cy="41.4" r="1.3" fill="#2867E4" opacity="0.35"/>
    <circle cx="7.1" cy="21.7" r="1.9" fill="#2867E4" opacity="0.55"/>
    <circle cx="22.6" cy="9.4" r="1.3" fill="#2867E4" opacity="0.35"/>
    <circle cx="42.3" cy="7.1" r="1.9" fill="#2867E4" opacity="0.55"/>
    <circle cx="54.6" cy="22.6" r="1.3" fill="#2867E4" opacity="0.35"/>
  </g>

  <!-- the burst itself: the part that has to work alone at 16 pixels -->
  <g>
    <path d="M32 12 Q33.8 27.5 52 32 Q33.8 36.5 32 52 Q30.2 36.5 12 32 Q30.2 27.5 32 12 Z" fill="#2867E4" opacity="0.55" transform="rotate(45 32 32)"/>
    <path d="M32 2 Q35.5 26 62 32 Q35.5 38 32 62 Q28.5 38 2 32 Q28.5 26 32 2 Z" fill="url(#novatools-body)"/>
    <circle cx="32" cy="32" r="6.5" fill="#EAF0FF"/>
  </g>
</svg>
