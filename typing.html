<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Typing race — NovaClip</title>
<meta name='description' content='A one-minute typing race with three boards: phones, laptops, and everyone together. Thumbs and keyboards are not the same sport.'>
<link rel='icon' href='logo.svg' type='image/svg+xml'>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#05070E;--panel:#0C1220;--line:rgba(255,255,255,.1);--txt:#E8EEFF;--dim:#8A97B4;
  --cyan:#00E5FF;--violet:#7C5CFF;--pink:#FF3D9A;--lime:#B6FF4A;--amber:#FFB443;
  --grad:linear-gradient(110deg,var(--violet),var(--cyan) 48%,var(--pink))}
body{background:var(--ink);color:var(--txt);min-height:100vh;margin-left:200px;
  font-family:'Geist','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
.wrap{width:min(760px,100% - 34px);margin:0 auto;padding:26px 0 70px}
/* The shared sidebar. nova.js fills in the links, so this file only supplies
   the shell it builds into — that is what keeps the nav identical everywhere. */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:200px;background:rgba(12,12,16,.85);
  backdrop-filter:blur(20px);display:flex;flex-direction:column;padding:20px 0;gap:4px;
  z-index:998;border-right:1px solid rgba(255,255,255,.06);overflow-y:auto}
.sidebar .themewrap{margin-top:auto;padding:16px 20px}
.sidebar .themewrap label{display:block;font-size:.78rem;opacity:.6;margin-bottom:6px}
.sidebar select{width:100%;font-size:.95rem;background:rgba(255,255,255,.05);color:var(--txt);
  border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:9px}
@media (max-width:760px){
  body{margin-left:0;padding-bottom:74px}
  .sidebar{flex-direction:row;top:auto;width:100%;height:64px;padding:0;overflow-x:auto;align-items:center}
  .sidebar .themewrap{display:none}
}
.top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.top img{width:30px;height:30px}
.top b{font-weight:700;letter-spacing:-.02em}
.back{margin-left:auto;font-size:13.5px;color:var(--dim);padding:9px 14px;border-radius:11px;
  border:1px solid var(--line)}
.back:hover{color:var(--txt)}
h1{font-size:clamp(2rem,5.4vw,3rem);font-weight:680;letter-spacing:-.042em;line-height:1.03}
h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:var(--dim);margin-top:14px;max-width:56ch}

/* ---- the hero glow: one soft light behind the title, so the page has a
   focal point instead of starting flat at the top of a dark rectangle ---- */
.hero{position:relative}
.hero::before{content:"";position:absolute;left:-90px;top:-140px;width:460px;height:300px;
  background:radial-gradient(closest-side,rgba(124,92,255,.30),transparent 72%);
  filter:blur(28px);pointer-events:none;z-index:-1}

/* ---- board switcher: a real segmented control with a sliding thumb ---- */
.modes{position:relative;display:inline-flex;gap:2px;margin:30px 0 14px;padding:4px;
  border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.03);flex-wrap:wrap}
.mode{position:relative;padding:9px 20px;border-radius:11px;font:inherit;font-size:14px;
  font-weight:600;cursor:pointer;border:0;background:none;color:var(--dim);
  transition:color .2s;z-index:1}
.mode:hover{color:var(--txt)}
.mode.on{color:#05070E}
.mode.on::before{content:"";position:absolute;inset:0;border-radius:11px;z-index:-1;
  background:var(--grad);box-shadow:0 4px 18px rgba(124,92,255,.45)}
.mode .cnt{margin-left:7px;font-size:11.5px;opacity:.72;font-variant-numeric:tabular-nums}
.why{font-size:13px;color:var(--dim);margin-bottom:24px;max-width:62ch}

/* ---- the typing card ---- */
.card{position:relative;border:1px solid var(--line);background:
  linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  border-radius:22px;padding:26px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(124,92,255,.7),rgba(0,229,255,.6),transparent)}
.card.live{border-color:rgba(0,229,255,.34);box-shadow:0 0 0 1px rgba(0,229,255,.10),0 22px 60px -30px rgba(0,229,255,.5)}

#passage{font:500 clamp(1.1rem,2.5vw,1.42rem)/1.95 ui-monospace,'SF Mono',Menlo,monospace;
  letter-spacing:.005em;word-break:break-word;min-height:5.9em}
#passage span{transition:color .12s,background .12s;border-radius:3px}
#passage .wd{white-space:nowrap}
#passage{overflow-wrap:anywhere}
.ok{color:var(--lime)}
.bad{color:var(--pink);background:rgba(255,61,154,.16);text-decoration:underline wavy var(--pink);
  text-underline-offset:5px}
/* the caret: a bar that blinks, which is what a text cursor looks like —
   a filled block hides the letter you are about to type */
.now{position:relative;color:var(--txt)}
.now::before{content:"";position:absolute;left:-2px;top:.12em;bottom:.12em;width:2px;
  background:var(--cyan);border-radius:2px;box-shadow:0 0 9px var(--cyan);animation:cb 1.05s steps(1) infinite}
@keyframes cb{0%,49%{opacity:1}50%,100%{opacity:0}}
.todo{color:#5C6883}

#feed{width:100%;margin-top:20px;padding:15px 17px;border-radius:14px;font:inherit;font-size:16px;
  background:rgba(0,0,0,.34);border:1px solid var(--line);color:var(--txt);transition:border-color .2s,box-shadow .2s}
#feed:focus{outline:none;border-color:rgba(0,229,255,.55);box-shadow:0 0 0 4px rgba(0,229,255,.10)}
#feed:disabled{opacity:.5}

/* ---- stats: the timer gets a ring so the last ten seconds are felt ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(120px,100%),1fr));gap:12px;margin-top:20px}
.stat{position:relative;padding:15px 16px;border-radius:15px;border:1px solid var(--line);
  background:rgba(255,255,255,.025);overflow:hidden}
.stat b{display:block;font:660 30px/1.05 ui-monospace,monospace;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;background:var(--grad);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.stat span{font-size:11.5px;color:var(--dim);letter-spacing:.02em}
.stat.warn b{background:linear-gradient(110deg,#FFB443,#FF3D9A);-webkit-background-clip:text;background-clip:text}
.stat.warn{border-color:rgba(255,180,67,.45);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,180,67,0)}50%{box-shadow:0 0 0 4px rgba(255,180,67,.12)}}
.stat .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--grad);transition:width .25s linear}

.btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.go{padding:12px 24px;border-radius:30px;border:0;cursor:pointer;font:inherit;font-weight:680;
  font-size:14.5px;color:#05070E;background:var(--grad);box-shadow:0 8px 26px -8px rgba(124,92,255,.7);
  transition:transform .16s,box-shadow .16s}
.go:hover{transform:translateY(-2px);box-shadow:0 14px 32px -10px rgba(124,92,255,.85)}
.alt{padding:12px 22px;border-radius:30px;cursor:pointer;font:inherit;font-weight:600;font-size:14.5px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--txt);transition:background .16s}
.alt:hover{background:rgba(255,255,255,.1)}

/* ---- the result card, shown when a run finishes ---- */
#result{display:none;margin-top:18px;padding:22px;border-radius:18px;text-align:center;
  border:1px solid rgba(182,255,74,.4);background:rgba(182,255,74,.06);
  animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
#result.no{border-color:rgba(255,61,154,.45);background:rgba(255,61,154,.07)}
#result .big{font:700 clamp(2.6rem,9vw,4rem)/1 ui-monospace,monospace;letter-spacing:-.05em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#result .cap{font-size:12.5px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase;margin-top:6px}
#result .det{font-size:14px;color:var(--dim);margin-top:12px}

/* ---- the board ---- */
.board{margin-top:38px}
.board h2{font-size:1.35rem;font-weight:660;letter-spacing:-.025em;margin-bottom:6px}
.board p.sub{color:var(--dim);font-size:13.5px;margin-bottom:16px}

/* top three get a podium tint and a medal; the rest are plain rows, because
   if everything is highlighted then nothing is */
.row{position:relative;display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.022);margin-bottom:8px;
  transition:transform .16s,border-color .16s}
.row:hover{transform:translateX(3px)}
.row .rank{width:28px;font:700 15px/1 ui-monospace,monospace;color:var(--dim);text-align:center}
.row.p1{border-color:rgba(255,215,64,.45);background:linear-gradient(100deg,rgba(255,215,64,.11),transparent 62%)}
.row.p2{border-color:rgba(200,214,238,.34);background:linear-gradient(100deg,rgba(200,214,238,.08),transparent 62%)}
.row.p3{border-color:rgba(205,127,50,.38);background:linear-gradient(100deg,rgba(205,127,50,.09),transparent 62%)}
.row.p1 .rank,.row.p2 .rank,.row.p3 .rank{font-size:17px}
.row .who{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.row .who>span:last-child{display:flex;flex-direction:column;min-width:0}
.row .face{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;flex:0 0 auto;
  font-size:17px;background:linear-gradient(120deg,var(--violet),var(--cyan));overflow:hidden}
.row .face img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.row .nm{font-size:15px;font-weight:580;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .when{font-size:11.5px;color:#5C6883;margin-top:1px}
.row .wpm{font:700 20px/1 ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--lime)}
.row .wpm i{font:500 10.5px/1 var(--f);font-style:normal;color:var(--dim);margin-left:3px}
.row .acc{font-size:12.5px;color:var(--dim);width:46px;text-align:right;font-variant-numeric:tabular-nums}
.row.me{border-color:rgba(0,229,255,.5);background:rgba(0,229,255,.07)}
.row.me::after{content:"YOU";position:absolute;right:-1px;top:-1px;font-size:9px;font-weight:800;
  letter-spacing:.1em;padding:3px 7px;border-radius:0 13px 0 9px;background:var(--cyan);color:#05070E}
.empty{padding:34px 18px;text-align:center;color:var(--dim);font-size:14px;
  border:1px dashed var(--line);border-radius:15px}
.note{color:var(--dim);font-size:12.5px;line-height:1.65;margin-top:18px;
  padding:13px 15px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid var(--line)}
</style>
</head>
<body>
<div class='sidebar'>
  <div class='themewrap'>
    <label data-t='language'>Language</label>
    <select id='langpick'></select>
  </div>
</div>

<div class='wrap'>

  <div class='hero'>
    <h1>Typing race, <span class='g'>three boards</span></h1>
    <p class='lede'>Sixty seconds. Thumbs on glass and ten fingers on a keyboard are not the same
      sport, so they do not share a table &mdash; and there is a third for everyone together.</p>
  </div>

  <div class='modes' id='modes'></div>
  <p class='why' id='why'></p>

  <div class='card' id='card'>
    <div id='passage'></div>
    <input id='feed' autocomplete='off' autocorrect='off' autocapitalize='off' spellcheck='false'
           placeholder='Click here and start typing&hellip;'>
    <div class='stats'>
      <div class='stat'><b id='sWpm'>0</b><span>words per minute</span></div>
      <div class='stat'><b id='sAcc'>100</b><span>% accurate</span></div>
      <div class='stat' id='stTime'><b id='sTime'>60</b><span>seconds left</span><i class='bar' id='sBar' style='width:100%'></i></div>
      <div class='stat'><b id='sBest'>0</b><span>your best here</span></div>
    </div>
    <div id='result'></div>
    <div class='btns'>
      <button class='go' id='again'>New passage</button>
      <button class='alt' id='reset'>Clear my scores</button>
    </div>
  </div>

  <div class='board'>
    <h2 id='bTitle'>Board</h2>
    <p class='sub' id='bSub'></p>
    <div id='rows'></div>
    <p class='note' id='bNote'></p>
  </div>
</div>

<script src='nova.js'></script>
<script>
/* ============================================================================
   TYPING RACE
   ============================================================================
   Three boards, because a phone and a laptop are different instruments. A good
   thumb-typist does 35-45 wpm; a good touch-typist does 80-110. Putting them in
   one table means the phone players never appear on it, so they stop playing.

   Which board you may post to is decided by the device, not by a dropdown:
   a coarse pointer with no fine pointer available is a phone or tablet, and a
   fine pointer is a mouse or trackpad next to a real keyboard. You cannot post
   a laptop score from a phone or the other way round — that is the whole point
   of separating them. Mixed always takes your run.
   ============================================================================ */
(function () {
  'use strict';
  const $ = id => document.getElementById(id);

  /* ---- which device is this ---------------------------------------------- */
  const coarse = matchMedia('(pointer: coarse)').matches;
  const fine   = matchMedia('(pointer: fine)').matches;
  const DEVICE = (coarse && !fine) ? 'mobile' : 'laptop';

  const BOARDS = [
    ['mobile', 'Phones', 'Typed with thumbs on glass.'],
    ['laptop', 'Keyboards', 'Typed on a real keyboard.'],
    ['mixed',  'Everyone', 'Every run, whatever it was typed on.']
  ];
  let board = DEVICE;

  /* ---- passages ----
     Ordinary sentences with ordinary punctuation. No pangrams and no lorem:
     you want the test to measure typing the words people actually type. */
  const PASSAGES = [
    'The best thumbnail is the one that still reads when it is the size of a stamp, because that is how most people will see it.',
    'Editing is mostly deciding what to remove. The first cut is always too long, and the second one usually is as well.',
    'Nobody watches a video because the transition was clever. They watch because the first five seconds promised something worth waiting for.',
    'A good title says what the video is, not how the video feels about itself. Curiosity works; confusion does not.',
    'Upload on a schedule you can keep on a bad week, not the one you can keep on a good one. Consistency beats intensity every time.',
    'The camera does not need to be expensive. The light does need to be in front of you, and the microphone does need to be close.',
    'Watch time is not a score you chase. It is a signal that somebody found the middle of your video as interesting as the start.',
    'Write the description for the person who is already convinced. Put the link where they will actually see it, near the top.'
  ];

  const DUR = 60;
  let text = '', typed = '', started = 0, timer = null, done = false, keys = 0;

  function key(b) { return 'nc_type_' + b; }
  function load(b) { try { return JSON.parse(localStorage.getItem(key(b)) || '[]'); } catch (e) { return []; } }
  function save(b, rows) { try { localStorage.setItem(key(b), JSON.stringify(rows.slice(0, 20))); } catch (e) {} }

  /* ---- the passage ------------------------------------------------------- */
  function newPassage() {
    text = PASSAGES[Math.floor(Math.random() * PASSAGES.length)];
    typed = ''; started = 0; done = false; keys = 0;
    clearInterval(timer); timer = null;
    $('feed').value = ''; $('feed').disabled = false;
    $('sWpm').textContent = '0'; $('sAcc').textContent = '100'; $('sTime').textContent = DUR;
    paint();
  }

  function paint() {
    /* Every character is its own span so it can be coloured independently —
       which means the browser is free to break the line BETWEEN any two of
       them, and words split down the middle and overflow the card. Grouping
       each word in a nowrap wrapper gives the breaks back to the spaces,
       where they belong. */
    let html = '', word = '';
    const cell = (ch, i) => {
      let cls = 'todo';
      if (i < typed.length) cls = typed[i] === ch ? 'ok' : 'bad';
      else if (i === typed.length) cls = 'now';
      return '<span class="' + cls + '">' +
        (ch === ' ' ? '&nbsp;' : ch.replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]))) +
        '</span>';
    };
    for (let i = 0; i < text.length; i++) {
      if (text[i] === ' ') {
        if (word) { html += '<span class="wd">' + word + '</span>'; word = ''; }
        html += cell(text[i], i);          // the space itself may break
      } else {
        word += cell(text[i], i);
      }
    }
    if (word) html += '<span class="wd">' + word + '</span>';
    $('passage').innerHTML = html;
  }

  function stats() {
    const elapsed = started ? (Date.now() - started) / 1000 : 0;
    let right = 0;
    for (let i = 0; i < typed.length; i++) if (typed[i] === text[i]) right++;
    /* A "word" is five characters, which is the standard the whole industry
       uses — otherwise "a a a a a" would beat "extraordinary". */
    const wpm = elapsed > 0 ? Math.round((right / 5) / (elapsed / 60)) : 0;
    const acc = typed.length ? Math.round(right / typed.length * 100) : 100;
    return { wpm: Math.max(0, wpm), acc, right };
  }

  function tick() {
    const left = Math.max(0, DUR - (Date.now() - started) / 1000);
    $('sTime').textContent = Math.ceil(left);
    /* The bar drains with the clock. A number counting down is information;
       a bar draining is a feeling, and the last ten seconds should feel like
       something. */
    $('sBar').style.width = (left / DUR * 100) + '%';
    $('stTime').classList.toggle('warn', left <= 10);
    const s = stats();
    $('sWpm').textContent = s.wpm;
    $('sAcc').textContent = s.acc;
    if (left <= 0) finish();
  }

  function showResult(ok, big, cap, det) {
    const r = $('result');
    r.style.display = 'block';
    r.className = ok ? '' : 'no';
    r.innerHTML = '<div class="big">' + big + '</div><div class="cap">' + cap + '</div>' +
                  (det ? '<div class="det">' + det + '</div>' : '');
  }

  function finish() {
    if (done) return;
    done = true;
    clearInterval(timer); timer = null;
    $('feed').disabled = true;
    $('card').classList.remove('live');
    const s = stats();
    if (s.right < 40) {
      showResult(false, s.wpm, 'not recorded',
        'You typed ' + s.right + ' correct characters. A run needs at least 40 to mean anything.');
      return draw();
    }
    /* The fastest verified humans sit around 210-230 wpm on familiar text.
       Anything past 250 did not come from a person, and letting it onto the
       board would make every honest score look pointless. */
    if (keys < s.right * 0.7) {
      showResult(false, s.wpm, 'not recorded',
        'Those characters arrived without keystrokes being pressed. Pasting is not typing.');
      return draw();
    }
    if (s.wpm > 250) {
      showResult(false, s.wpm, 'not recorded',
        'That is past what anyone has typed. The fastest verified humans sit around 210-230.');
      return draw();
    }

    const row = {
      name: (window.ncName && ncName()) || 'You',
      face: (window.ncAvatar && ncAvatar()) || '⭐',
      wpm: s.wpm, acc: s.acc, at: Date.now(), dev: DEVICE, me: true
    };
    /* Your run goes on your device's board and on Mixed — never on the other
       device's board, which is what keeps the separation meaningful. */
    let place = 0;
    [DEVICE, 'mixed'].forEach(b => {
      const rows = load(b);
      rows.push(row);
      rows.sort((x, y) => y.wpm - x.wpm || y.acc - x.acc);
      save(b, rows);
      if (b === DEVICE) place = rows.indexOf(row) + 1;
    });
    const best = (load(DEVICE)[0] || {}).wpm || 0;
    showResult(true, s.wpm, 'words per minute',
      s.acc + '% accurate \u00b7 ' +
      (place === 1 ? 'a new best on ' + BOARDS.find(b => b[0] === DEVICE)[1]
                   : 'number ' + place + ' on ' + BOARDS.find(b => b[0] === DEVICE)[1] +
                     ' \u00b7 your best is ' + best));
    draw();
  }

  /* Pasting the passage in would post a four-figure score, so it is refused
     outright rather than filtered later. */
  /* Characters that arrive without a key having been pressed did not come from
     fingers. Counting keydowns and comparing at the end catches a paste, an
     autofill and a script setting .value directly, and it does not misfire on
     someone who simply types quickly — which a naive speed threshold does. */
  $('feed').addEventListener('keydown', e => {
    if (e.key && e.key.length === 1 || e.key === 'Backspace') keys++;
  });

  $('feed').addEventListener('paste', e => {
    e.preventDefault();
    $('bNote').textContent = 'Pasting is not typing. Nice try.';
  });

  $('feed').addEventListener('input', e => {
    if (done) return;
    if (!started) { started = Date.now(); timer = setInterval(tick, 200); $('card').classList.add('live'); $('result').style.display = 'none'; }
    typed = e.target.value;
    if (typed.length >= text.length) { paint(); finish(); return; }
    paint();
    const s = stats();
    $('sWpm').textContent = s.wpm; $('sAcc').textContent = s.acc;
  });

  /* ---- boards ------------------------------------------------------------ */
  function drawModes() {
    $('modes').innerHTML = BOARDS.map(([id, label]) =>
      '<button class="mode' + (id === board ? ' on' : '') + '" data-b="' + id + '">' + label + '</button>').join('');
    $('modes').querySelectorAll('.mode').forEach(b =>
      b.onclick = () => { board = b.dataset.b; drawModes(); draw(); });
    const other = DEVICE === 'mobile' ? 'Keyboards' : 'Phones';
    $('why').textContent = DEVICE === 'mobile'
      ? 'You are on a touch screen, so your runs post to Phones and Everyone. ' +
        'You can read the ' + other + ' board but not post to it.'
      : 'You have a keyboard, so your runs post to Keyboards and Everyone. ' +
        'You can read the ' + other + ' board but not post to it.';
  }

  function draw() {
    const meta = BOARDS.find(b => b[0] === board);
    $('bTitle').textContent = meta[1];
    $('bSub').textContent = meta[2];
    const rows = load(board);
    $('sBest').textContent = (load(DEVICE)[0] || {}).wpm || 0;

    const ago = t => {
      const m = Math.round((Date.now() - t) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + ' min ago';
      const h = Math.round(m / 60);
      return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
    };
    $('rows').innerHTML = rows.length ? rows.slice(0, 10).map((r, i) => {
      const face = String(r.face || '').startsWith('data:')
        ? '<span class="face"><img src="' + r.face + '" alt=""></span>'
        : '<span class="face">' + (r.face || '⭐') + '</span>';
      /* Medals for the top three, plain numbers after. If every row is
         decorated then none of them stand out, which defeats a leaderboard. */
      const medal = ['\u{1F947}', '\u{1F948}', '\u{1F949}'][i] || (i + 1);
      return '<div class="row' + (r.me ? ' me' : '') + (i < 3 ? ' p' + (i + 1) : '') + '">' +
        '<span class="rank">' + medal + '</span>' +
        '<span class="who">' + face + '<span><span class="nm">' +
          String(r.name).replace(/[<>&]/g, '') + '</span>' +
          '<span class="when">' + ago(r.at || Date.now()) + '</span></span></span>' +
        '<span class="wpm">' + r.wpm + '<i>wpm</i></span>' +
        '<span class="acc">' + r.acc + '%</span></div>';
    }).join('') : '<p class="empty">Nothing here yet. Type a passage and you are first.</p>';

    /* The honest bit. There is no server in this project, so these are your own
       runs on this device — not a global ranking. Saying "leaderboard" and
       showing one name would be a lie the visitor can spot in ten seconds. */
    $('bNote').textContent = window.NC_SERVER
      ? 'Ranked against everyone who has played.'
      : 'These are your own runs, kept in this browser. There is no server behind ' +
        'NovaClip, so nothing is uploaded and nobody else can see them — which also ' +
        'means this is not a global ranking yet. Clearing your site data clears it.';
  }

  $('again').onclick = newPassage;
  $('reset').onclick = () => {
    if (!confirm('Clear every score on all three boards?')) return;
    BOARDS.forEach(([id]) => localStorage.removeItem(key(id)));
    draw();
  };

  drawModes(); newPassage(); draw();
  addEventListener('load', () => { if (window.ncAgeGate) ncAgeGate(); });
})();
</script>
</body>
</html>
