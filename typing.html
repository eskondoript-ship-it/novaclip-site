<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
<!-- Google Analytics 4 (gtag.js) — measurement ID G-QN1QE08F2K.
     In the head on every page, which is where Google's own snippet goes: it
     loads async so it never blocks a paint, and page_view fires without any
     further wiring.

     THIS IS WHY privacy.html CHANGED IN THE SAME COMMIT. That page said there
     was no analytics on NovaClip. From here that is not true, and a policy
     that quietly drifts from what the software does is a promise being broken
     without telling anybody. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QN1QE08F2K"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  /* CONSENT FIRST, MEASUREMENT SECOND.
     Denied before anything else runs, so no analytics cookie is written and no
     measurement is sent until somebody says yes. In the EU that is the order
     the law asks for, and this audience is 13-18, which raises the bar rather
     than lowering it.

     Google's own snippet does not do this — the default is granted, and the
     tag starts measuring on load. Reversing the default is the whole point:
     "ask afterwards" is not asking.

     nova.js draws the banner and calls gtag('consent','update',...) when the
     answer comes in; a stored yes from a previous visit is applied here so the
     question is asked once rather than on every page. */
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied',
    wait_for_update: 500
  });
  try {
    if (localStorage.getItem('nc_consent') === 'yes') {
      gtag('consent', 'update', { analytics_storage: 'granted' });
    }
  } catch (e) {}

  gtag('js', new Date());
  gtag('config', 'G-QN1QE08F2K');
</script>

  <style id="nc-shell">
      /* ------------------------------------------------------------------
         The NovaClip shell.

         nova.js builds the site's sidebar into .sidebar and floats the points
         badge into a corner. This app brought its own top navbar, which is
         kept — it is how you move between Play, Modes, Stats and the rest,
         and the site sidebar is how you leave for the Editor or the Arena.
         Two bars doing two different jobs, so neither is redundant.

         Everything here is layout only. The app's own stylesheet is untouched
         so it still looks like itself.
         ------------------------------------------------------------------ */
      body { margin-left: 200px; }

      .sidebar {
        position: fixed; left: 0; top: 0; bottom: 0; width: 200px; z-index: 998;
        background: rgba(12, 12, 16, .85); backdrop-filter: blur(20px);
        display: flex; flex-direction: column; padding: 20px 0; gap: 4px;
        border-right: 1px solid rgba(255, 255, 255, .06); overflow-y: auto;
      }
      .sidebar .themewrap { margin-top: auto; padding: 16px 20px; }

      /* No horizontal offsets on .navbar. It is position:sticky, so left/right
         are the stuck-position thresholds rather than a full-width stretch —
         setting them dragged the whole bar back under the sidebar and clipped
         the brand. The body margin already puts it in the right place. */

      /* nova.js pins the site's points badge to the top-right of the viewport,
         which is where this app puts its own profile chip — measured 58px of
         overlap at 1400px and 72px at 390px, sitting on the level and XP text.
         The badge is fixed and site-wide, so the page yields to it: reserve its
         width at the end of the bar instead of moving it somewhere unfamiliar. */
      .navbar-inner { padding-right: 92px; }

      /* At 760px the site sidebar becomes a bottom strip, which is what every
         other NovaClip page does. The app has its own bottom bar at 900px, so
         below 760 there are two of them: the app's moves up to sit on top of
         the site's, and the body reserves the height of both. Left as-is they
         land on each other and the lower one is unreachable. */
      @media (max-width: 760px) {
        body { margin-left: 0; padding-bottom: 134px; }
        .sidebar {
          flex-direction: row; top: auto; width: 100%; height: 64px;
          padding: 0; overflow-x: auto; align-items: center;
        }
        .sidebar .themewrap { display: none; }
        .mobile-nav { bottom: 64px; }

        /* On a phone the reserved space is not enough on its own: the bar is
           space-between, so once the brand and the profile chip are wider than
           what is left the chip overflows the padding and lands under the badge
           anyway. Drop the chip here — the same avatar, name, level and XP are
           on the Profile tab in the bar at the bottom of the screen.
           The !important is not decoration: that chip carries an inline
           style={{ display: 'flex' }} from the component, and an inline style
           beats any stylesheet rule no matter how specific. */
        .navbar-inner > .nav-link:last-child { display: none !important; }
      }

      /* nova.js mirrors the whole document for Persian, Arabic and Urdu. That
         is right for a page you read and wrong for a typing test: the passage
         would run right to left while the keys do not. The game stays LTR; the
         site chrome around it still translates. */
      #root { direction: ltr; }
    </style>

<script>
/* ============================================================================
   TYPING — the one that could not be hooked directly
   ============================================================================
   typing.html is a compiled bundle on one line. There is no exported function
   to call when a race ends, and editing minified code to add one would be
   undone by the next rebuild of it.

   So this watches its own storage instead. The bundle keeps everything under
   keys beginning "typemaster.v1." and writes them when a race finishes; this
   reads whatever WPM it can find in them and posts the best it has seen. It
   never writes to those keys and never assumes a shape beyond "a number
   called wpm somewhere in there", so a rebuild that renames things degrades to
   posting nothing rather than to posting nonsense.

   One second, not four: this is a localStorage read, not a network call, and
   it stops as soon as the tab is hidden. */
(function () {
  if (/[?&]embed=1/.test(location.search)) return;

  function best() {
    var top = 0;
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf('typemaster.v1.') !== 0) continue;
        var v;
        try { v = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { continue; }
        top = Math.max(top, scan(v, 0));
      }
    } catch (e) {}
    return top;
  }

  /* Walks whatever shape it finds. Depth-capped so a cyclic or huge structure
     cannot lock the tab up for the sake of a leaderboard. */
  function scan(v, depth) {
    if (depth > 4 || v == null) return 0;
    if (Array.isArray(v)) {
      var m = 0;
      for (var i = 0; i < v.length && i < 400; i++) m = Math.max(m, scan(v[i], depth + 1));
      return m;
    }
    if (typeof v !== 'object') return 0;
    var out = 0;
    for (var k in v) {
      if (!Object.prototype.hasOwnProperty.call(v, k)) continue;
      var val = v[k];
      if (/^(wpm|bestWpm|best_wpm|topWpm)$/i.test(k) && typeof val === 'number' &&
          isFinite(val) && val > 0 && val < 400) {
        out = Math.max(out, Math.round(val));
      } else {
        out = Math.max(out, scan(val, depth + 1));
      }
    }
    return out;
  }

  var posted = 0, timer = 0;
  function look() {
    var b = best();
    if (b > posted) {
      posted = b;
      try { localStorage.setItem('nc_typing_best', String(b)); } catch (e) {}
      try { if (window.NC_BOARD) NC_BOARD.submit('typing', b); } catch (e) {}
    }
  }
  function run() {
    clearInterval(timer);
    if (document.visibilityState === 'visible') timer = setInterval(look, 1000);
  }
  document.addEventListener('visibilitychange', run);
  addEventListener('pagehide', function () { clearInterval(timer); });

  function go() {
    var host = document.createElement('div');
    (document.querySelector('.wrap') || document.body).appendChild(host);
    NC_BOARD.mount('typing', host);
    posted = best();          // do not re-post a best that was already up there
    run();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
  else go();
})();
</script>
</body>
