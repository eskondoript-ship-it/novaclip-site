<!DOCTYPE html>
<html lang='en'>
<head>
<script>/* Theme before first paint. nova.js runs at the end of <body>, so a theme
   applied there lands after the page has already been painted dark — a white
   flash on every navigation for anyone using light mode. Six lines here cost
   nothing and remove it. Kept in sync with ncApplyTheme() in nova.js. */
(function(){try{var p=localStorage.getItem('nc_theme')||'system';
var t=(p==='light'||p==='dark')?p:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
var r=document.documentElement;r.setAttribute('data-theme',t);r.setAttribute('data-theme-pref',p);
r.style.colorScheme=t;}catch(e){}})();</script>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Games — NovaClip</title>
<meta name='description' content='Typing race and Nova Flap — two NovaClip games in one place.'>
<link rel='icon' href='logo.svg' type='image/svg+xml'>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--ink:var(--nc-bg,#05070E);--panel:var(--nc-bg2,#0C1220);--line:rgba(255,255,255,.1);--txt:var(--nc-text,#E8EEFF);--dim:var(--nc-dim2,#8A97B4);
  --cyan:var(--nc-cyan2,#00E5FF);--violet:var(--nc-violet,#7C5CFF);--pink:var(--nc-pink,#FF3D9A);
  --grad:linear-gradient(110deg,var(--violet),var(--cyan) 48%,var(--pink))}
html,body{height:100%}
body{background:var(--ink);color:var(--txt);overflow:hidden;
  font-family:'Geist','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
/* nova.js drives the rail width; 200px is the fallback for a load before it runs */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--nc-rail,200px);z-index:998;
  background:rgba(12,12,16,.85);backdrop-filter:blur(20px);display:flex;flex-direction:column;
  padding:20px 0;gap:4px;border-right:1px solid rgba(255,255,255,.06);overflow-y:auto}
.sidebar .themewrap{margin-top:auto;padding:16px 20px}
.shell{margin-left:var(--nc-rail,200px);height:100vh;display:flex;flex-direction:column}
.tabs{display:flex;gap:8px;padding:12px clamp(14px,2vw,26px) 0;flex-shrink:0}
.tabs button{padding:10px 20px;border-radius:12px 12px 0 0;border:1px solid var(--line);
  border-bottom:0;background:rgba(255,255,255,.03);color:var(--dim);cursor:pointer;
  font:600 14px/1 inherit;transition:color .15s,background .15s}
.tabs button:hover{color:var(--txt)}
.tabs button.on{background:var(--panel);color:var(--txt);position:relative}
.tabs button.on::after{content:'';position:absolute;left:14px;right:14px;top:0;height:2px;
  border-radius:2px;background:var(--grad)}
.frames{flex:1;min-height:0;border-top:1px solid var(--line);position:relative}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--ink)}
.frames iframe.on{display:block}
@media (max-width:760px){
  .shell{margin-left:0;height:calc(100vh - 64px)}
  .tabs{padding:8px 10px 0}
  .tabs button{flex:1;padding:9px 8px;font-size:13px}
}
</style>
</head>
<body>
<div class='sidebar'>
  <div class='themewrap'>
    <label data-t='language'>Language</label>
    <select id='langpick'></select>
  </div>
</div>

<div class='shell'>
  <div class='tabs' id='tabs' role='tablist'></div>
  <div class='frames' id='frames'></div>
</div>

<script src='nova.js'></script>
<script src='biometric.js' defer></script>
<script>
/* Two pages, one address. The tab you are on is in the URL as #<name>, so a
   link or a reload lands where you left rather than always on the first tab. */
const TABS = [{"key": "typing", "label": "Typing race", "src": "typing.html?embed=1"}, {"key": "flap", "label": "Nova Flap", "src": "flap.html?embed=1"}];

const tabs = document.getElementById('tabs');
const frames = document.getElementById('frames');

TABS.forEach((t, i) => {
  const b = document.createElement('button');
  b.textContent = t.label;
  b.type = 'button';
  b.setAttribute('role', 'tab');
  b.dataset.k = t.key;
  tabs.appendChild(b);

  const f = document.createElement('iframe');
  f.dataset.k = t.key;
  f.title = t.label;
  /* Only the first frame loads now. The other one loads the first time it is
     asked for — two heavy pages booting at once is a slow, janky open. */
  if (i === 0) f.src = t.src;
  else f.dataset.src = t.src;
  frames.appendChild(f);
});

function show(key) {
  const t = TABS.find(x => x.key === key) || TABS[0];
  tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === t.key));
  frames.querySelectorAll('iframe').forEach(f => {
    const on = f.dataset.k === t.key;
    f.classList.toggle('on', on);
    if (on && !f.src && f.dataset.src) f.src = f.dataset.src;
  });
  if (location.hash.slice(1) !== t.key) history.replaceState(null, '', '#' + t.key);
  document.title = t.label + ' — NovaClip';
}

tabs.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) show(b.dataset.k);
});
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1) || TABS[0].key);
</script>
</body>
</html>
